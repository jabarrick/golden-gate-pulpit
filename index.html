<style>
/* 布局：手机单列，场景吸顶；宽屏两栏，左栏（场景+指标）固定，右栏是当前这一步的卡片 */
:root{color-scheme:dark;--ink:#f4ecda;--dim:#b3a78f;--bg:#120f1a;--panel:#1d1929;--panel2:#262036;--line:#3b3350;--gold:#dcae52;--lacquer:#b93a26;--green:#77b587;--blue:#7696cf;--bad:#e3806c;
 --display:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;--body:"Noto Serif SC","Songti SC","SimSun",serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:radial-gradient(110% 60% at 50% 0%,#3b1a1f 0%,transparent 60%),repeating-linear-gradient(45deg,#ffffff05 0 2px,transparent 2px 14px);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 20px;min-height:100%;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-size:27px;font-weight:400;margin:0;color:var(--gold);line-height:1;text-shadow:0 2px 0 #5a1c12}
h1 small{font-family:var(--body);font-size:9.5px;color:var(--dim);letter-spacing:.22em;margin-left:8px;vertical-align:middle}
.wkbox{text-align:right}
#wk{font-size:11.5px;color:var(--dim);display:block}
#dots{display:flex;gap:3px;justify-content:flex-end;margin-top:3px}
#dots i{width:9px;height:4px;border-radius:2px;background:#3b3350}
#dots i.d{background:var(--gold)}#dots i.c{background:var(--lacquer);box-shadow:0 0 6px var(--lacquer)}
.left{display:contents}
#stage{position:sticky;top:0;z-index:5;border:1px solid #6b5326;border-radius:12px;overflow:hidden;background:#0d0b14;box-shadow:0 0 0 2px #1a1420,0 0 0 3px #dcae5255,0 10px 26px #000b}
#scene svg{display:block;width:100%;height:auto}
.p{transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box}
.h{opacity:0}
.stand .p{transform:translateY(-7px)}
.stand .h{opacity:1;animation:clap .22s infinite alternate}
.stand .hr{animation-name:clapr}
@keyframes clap{to{transform:translateX(1.6px)}}
@keyframes clapr{to{transform:translateX(-1.6px)}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.combo{position:absolute;left:0;right:0;top:8%;text-align:center;font-family:var(--display);font-size:34px;color:#ffd76a;text-shadow:0 2px 0 #7a2a14,0 0 16px #c8452e;animation:pop 2.4s forwards}
.combo small{display:block;font-family:var(--body);font-weight:900;font-size:15px;color:#fff3c4}
@keyframes pop{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.25);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.bub{position:absolute;background:#fffaf0;color:#2a1a14;font-size:12px;font-weight:600;padding:3px 9px;border-radius:11px 11px 11px 2px;box-shadow:0 2px 6px #0008;white-space:nowrap;opacity:0;animation:bub 2.3s forwards}
@keyframes bub{12%{opacity:1;transform:translateY(-6px)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.coin{position:absolute;top:-16px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a0,#d9a94a 60%,#8a6217);animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(260px) rotate(540deg);opacity:.2}}
#crew{position:absolute;left:5px;top:5px;display:flex;gap:2px;flex-wrap:wrap;max-width:60%}
#crew svg{box-shadow:0 0 0 1px #0008}
/* 指标 */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.st{background:linear-gradient(#241f33,#1b1727);border:1px solid var(--line);border-radius:8px;padding:4px 3px 5px;text-align:center}
.st b{display:block;font-size:10px;color:var(--dim);font-weight:400;white-space:nowrap}
.st i{font-style:normal;font-size:15px;font-weight:600;line-height:1.25}
.st.warn{border-color:var(--bad);animation:warn 1s infinite alternate}
.st.warn i{color:var(--bad)}
@keyframes warn{to{box-shadow:0 0 10px #e3806c88}}
.bar{height:3px;background:#0b0912;border-radius:2px;overflow:hidden;margin:3px 4px 0}
.bar span{display:block;height:100%;border-radius:2px;transition:width .5s}
#purse{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:10.5px;color:var(--dim)}
#purse div{border:1px dashed var(--line);border-radius:8px;padding:3px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;white-space:nowrap}
#purse b{color:var(--gold);font-size:12.5px;font-weight:600}
#steps{display:flex;gap:0;font-size:11px;color:#7f7592;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#17131f}
#steps span{flex:1;text-align:center;padding:3px 0;border-right:1px solid var(--line)}
#steps span:last-child{border:0}
#steps span.d{color:var(--dim)}
#steps span.c{background:var(--lacquer);color:#fff3dc;font-weight:600}
/* 卡片 */
.card{background:linear-gradient(var(--panel),#191522);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;flex:1;position:relative;animation:in .22s ease-out}
@keyframes in{from{transform:translateY(6px);opacity:.4}}
.card:before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.18em;color:#ffd9b0;font-weight:600;background:#b93a2633;border:1px solid #b93a2688;border-radius:999px;padding:1px 10px}
h2{font-size:17px;margin:6px 0 6px;text-wrap:balance;line-height:1.4}
h2.big{font-family:var(--display);font-weight:400;font-size:30px;color:var(--gold)}
p{margin:6px 0;font-size:13.5px}
.prev{margin-bottom:10px}
.fb{border-radius:8px;padding:7px 10px;border-left:4px solid var(--dim);background:#221d2e}
.fb p{margin:2px 0}
.fb.ok{border-color:var(--green);background:#1b2a22}
.fb.hot{border-color:var(--gold);background:#2d2416}
.fb.bad{border-color:var(--bad);background:#2d1c1c}
.quote{border-left:3px solid var(--lacquer);padding:8px 12px;background:#2a1a20;margin:8px 0;font-size:14.5px;border-radius:0 8px 8px 0;font-weight:600}
.quote cite{display:block;font-size:11px;color:var(--dim);font-style:normal;font-weight:400;margin-top:3px}
.memo{border:1px solid #3b4a6a;border-left:3px solid var(--blue);padding:8px 12px;background:#182031;margin:8px 0;font-size:12.5px;border-radius:0 8px 8px 0;font-family:ui-monospace,Menlo,monospace,var(--body)}
.chat{border-left:3px solid var(--green);padding:8px 12px;background:#19251e;margin:8px 0;font-size:13px;border-radius:0 8px 8px 0}
button{font-family:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;text-align:left;width:100%;margin-top:7px;cursor:pointer;line-height:1.45;transition:border-color .12s,background .12s,transform .08s}
button:hover:not(:disabled){border-color:var(--gold);background:#332b49}
button:active:not(:disabled){transform:scale(.985)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button small{display:block;color:var(--dim);font-size:12px;line-height:1.4;margin-top:1px}
button:disabled{opacity:.42;cursor:default}
button.go{text-align:center;background:linear-gradient(#cf4a30,#a52f1e);border-color:#e0a05a;font-weight:600;font-size:14.5px;letter-spacing:.08em;margin-top:12px;box-shadow:0 3px 0 #5a1c12}
button.go:hover{background:linear-gradient(#dc5638,#b23622)}
button.opt{padding-left:40px;position:relative}
.k{position:absolute;left:9px;top:9px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:12px;display:grid;place-items:center;background:#17131f}
button.opt:hover .k{border-color:var(--gold);color:var(--gold)}
button.verse{background:linear-gradient(90deg,#2b2433,#262036);border-left:3px solid var(--gold)}
button.verse .ref{color:var(--gold);font-size:12px;letter-spacing:.06em}
button.verse small{color:var(--ink);font-size:13.5px;line-height:1.5}
/* 商店与同工 */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.shop button{margin:0;padding:7px 9px;font-size:12.5px}
.shop button small{font-size:10.5px}
.tabs{display:flex;gap:5px;margin-top:8px}
.tabs button{flex:1;margin:0;text-align:center;padding:5px 4px;font-size:12px;border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#1d1408;font-weight:600}
.row{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.pr{color:var(--gold);font-size:11.5px;white-space:nowrap}
button.own{opacity:1;border-color:#6b5326;background:#2a2318}
button.own .pr{color:var(--green)}
.stf{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px;margin-top:6px;background:#221d30}
.stf.on{border-color:var(--gold);background:#30261c}
.stf .i{flex:1;font-size:11.5px;color:var(--dim);line-height:1.45}.stf .i b{color:var(--ink);font-size:13.5px}.stf .i em{font-style:normal;color:var(--gold)}
.stf button{width:auto;margin:0;padding:6px 11px;font-size:12px;text-align:center;flex:none}
.trk{font-size:12px;color:var(--gold);margin:12px 0 0;font-weight:600;letter-spacing:.1em;border-bottom:1px solid var(--line);padding-bottom:3px}
.res{font-size:12px;color:var(--dim);margin-top:5px}
.up{color:var(--green)}.dn{color:var(--bad)}
input[type=range]{width:100%;accent-color:var(--gold);margin:10px 0 4px;height:26px}
.split{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}
.split b{font-size:19px;color:var(--ink)}
.money{color:var(--gold);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
td{padding:4px 0;border-bottom:1px dashed var(--line)}td:first-child{color:var(--dim)}td:last-child{text-align:right;font-weight:600}
footer{font-size:10.5px;color:#7d7390;text-align:center}
@media(min-width:900px){
 .wrap{max-width:1060px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"hd hd" "lf rt" "ft ft";align-items:start;gap:12px 18px;min-height:0}
 header{grid-area:hd}footer{grid-area:ft}
 .left{display:flex;flex-direction:column;gap:8px;grid-area:lf;position:sticky;top:12px}
 #stage{position:relative}
 .card{grid-area:rt;max-height:calc(100vh - 110px);overflow-y:auto}
}
/* 手机：整局一屏，不滚动页面；只有卡片内部在内容过长时滚动，主按钮吸在卡片底部 */
@media(max-width:899px){
 html,body{overflow:hidden}
 .wrap{height:100%;min-height:0;padding:6px 10px 8px;gap:5px}
 h1{font-size:22px}h1 small{display:none}
 #stage{position:relative;flex:none;border-radius:10px}
 #scene svg{max-height:25vh}
 #steps,.hint{display:none}
 .fb p{font-size:12px;line-height:1.4}
 .tag{font-size:10px;padding:0 9px}
 .stats{gap:3px}.st{padding:2px 2px 4px;border-radius:6px}.st b{font-size:9.5px}.st i{font-size:13.5px}
 #purse{gap:3px;font-size:9.5px}#purse div{padding:1px 6px;border-radius:6px}#purse b{font-size:11.5px}
 #steps{font-size:10.5px}#steps span{padding:1px 0}
 .card{flex:1 1 0;min-height:0;overflow-y:auto;padding:10px 11px 0;border-radius:10px;overscroll-behavior:contain}
 .card>:last-child{margin-bottom:10px}
 h2{font-size:15px;margin:4px 0}h2.big{font-size:25px}
 p{font-size:12.5px;margin:4px 0}
 .quote{font-size:13px;padding:6px 10px;margin:5px 0}.quote cite{display:none}
 .fb{padding:5px 9px}.prev{margin-bottom:6px}
 button{padding:6px 9px;font-size:12.5px;margin-top:5px;line-height:1.35}
 button small,button.verse small{font-size:12px;line-height:1.3;margin-top:0}
 button.verse .ref{font-size:11px}
 button.opt{padding-left:34px}.k{left:7px;top:7px;width:20px;height:20px;font-size:11px}
 button.go{position:sticky;bottom:8px;margin-top:8px;font-size:14px;padding:9px;z-index:2;box-shadow:0 3px 0 #5a1c12,0 -10px 14px 6px #191522}
 .shop{gap:4px}.shop button{padding:5px 7px;font-size:11.5px}.shop button small{font-size:10px}
 .stf{padding:4px 5px;gap:7px;margin-top:4px}.stf .i{font-size:10.5px;line-height:1.35}.stf .i b{font-size:12.5px}.stf svg{width:42px;height:42px}
 .tabs{margin-top:5px}.tabs button{font-size:11.5px;padding:4px 2px}
 footer{display:none}
}
@media(max-width:380px){.st b{font-size:9px}.st i{font-size:13.5px}#purse{font-size:9.5px}#purse b{font-size:11.5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 语言切换与非中文排版 */
#lang{display:flex;gap:3px;justify-content:flex-end;margin-bottom:3px}
#tools{display:flex;gap:3px;margin-right:6px}
#tools button{border-color:#6b5326;color:var(--gold)}
#ov{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:10px}
#ov.open{display:flex}
#ovp{background:var(--panel);border:1px solid #6b5326;border-radius:12px;width:100%;max-width:660px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 12px 40px #000}
#ovh{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--gold);font-size:15px}
#ovh .x{width:auto;margin:0;padding:3px 12px;font-size:12px;border-radius:999px;text-align:center}
#ovb{overflow-y:auto;padding:4px 12px 14px;overscroll-behavior:contain}
#ovb h3{font-size:13.5px;color:var(--gold);margin:12px 0 2px}
#ovb p{font-size:12.5px;margin:3px 0}
#ovb .tabs button{font-size:11.5px;padding:4px 2px}
.we{border-left:3px solid var(--gold);background:#241f33;border-radius:0 8px 8px 0;padding:6px 10px;margin-top:6px}
.we .ref{color:var(--gold);font-size:12px}
.we.lock{border-color:var(--line);color:#7f7592;font-size:12px}
#dump{width:100%;height:120px;background:#120f1a;color:var(--dim);border:1px solid var(--line);border-radius:8px;font:11px ui-monospace,Menlo,monospace;padding:6px;margin-top:4px}
button.peek{box-shadow:0 0 0 2px var(--green)}
/* 在任同工的头像排在画面下方一行，不再盖住礼拜堂 */
#crew{position:static;display:grid;grid-template-columns:repeat(20,minmax(0,22px));gap:1px;max-width:none;justify-content:center}
#crew:empty{display:none}
#crew svg{width:100%;height:auto;box-shadow:none;border-radius:4px}
#cam{position:absolute;right:6px;bottom:6px;width:auto;margin:0;padding:1px 10px;font-size:11px;line-height:1.7;border-radius:999px;background:#120f1acc;border-color:#6b5326;color:var(--gold);text-align:center;z-index:3}
#photo{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #6b5326;margin-top:8px}
a.dl{display:block;text-align:center;margin-top:10px;padding:9px;border-radius:10px;background:linear-gradient(#cf4a30,#a52f1e);border:1px solid #e0a05a;color:var(--ink);font-weight:600;text-decoration:none;box-shadow:0 3px 0 #5a1c12}
a.dl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:899px){#lang button{font-size:10px;padding:0 6px}#tools{margin-right:4px}}
#lang button,#tools button{width:auto;margin:0;padding:0 8px;font-size:10.5px;line-height:1.7;border-radius:999px;text-align:center}
#lang button.on{background:var(--gold);border-color:var(--gold);color:#1d1408;font-weight:600}
html:not([lang^="zh"]) h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:23px;letter-spacing:.01em}
html:not([lang^="zh"]) h1 small{font-family:var(--display);font-size:15px;letter-spacing:.1em;color:#8f7a4a}
html:not([lang^="zh"]) h2.big{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:25px}
html:not([lang^="zh"]) .combo{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:28px}

html:not([lang^="zh"]) button.go{letter-spacing:.02em}

html:not([lang^="zh"]) .k{font-family:Georgia,serif}

@media(max-width:899px){
 html:not([lang^="zh"]) h1{font-size:15.5px}
 html:not([lang^="zh"]) h2.big{font-size:21px}

</style>

<body>
<div class="wrap">
<header><h1 id="ttl"></h1><div class="wkbox"><div id="lang" role="group" aria-label="Language"><span id="tools"><button id="bw"></button><button id="bd"></button></span><button data-l="zh">中文</button><button data-l="en">EN</button><button data-l="pt">PT</button></div><span id="wk"></span><div id="dots"></div></div></header>
<div class="left"><div id="stage"><div id="scene"></div><div id="fx"></div><button id="cam"></button></div>
<div id="crew"></div>
<div class="stats" id="stats"></div>
<div id="purse"></div>
<div id="steps"></div></div>
<div class="card" id="card"></div>
<footer id="foot"></footer>
<div id="ov"><div id="ovp" role="dialog" aria-modal="true"><div id="ovh"></div><div id="ovb"></div></div></div>
</div>
<script>
const PACK={zh:{},en:{},pt:{}};
PACK.zh.ui={
 lang:'zh-Hans',title:'金门讲坛 · 2049',h1:'金门讲坛<small>GOLDEN GATE PULPIT</small>',foot:'虚构讽刺作品 · 人物、教会与机构均属杜撰',
 week:(w,n,y,Y)=>`${2049+y}年${w+2}月 · 第 ${w}/${n} 主日 · 第 ${y+1}/${Y} 年`,yearEndHdr:'2049年 · 年终',
 st:['会众','信任','总部宠信','审计风险','西克声势','连击'],purse:['本周进账','堂会基金','已汇德州'],steps:['讲道','奉献','电汇','同工','陈设','周间'],
 eTip:'连击打赏',eInsp:'每周奉献',snd:['咣——！','咚咚咚！','啪！','满堂起立鼓掌'],combo:n=>`连击 ×${n}`,
 introTag:'序',introH:'2049—2051，旧金山',
 intro:`<p>美国本土的神学院招不满人已经二十年了。如今从波士顿到圣迭戈，站在讲坛上的多半是华人牧师。</p>
 <p>你是<b>李约翰牧师</b>，牧养华埠斯托克顿街的<b>金门恩典堂</b>——德州沃思堡「孤星万国事工」的第四十一号分堂。海湾对面，<b>西克先生（Mr. Sick）</b>正在电波里宣讲白人至上的“神学”。</p>
 <p>每个主日讲道三个回合：西克每抛出一条论调，你要从几节<b>圣经原文</b>里挑出真正对得上的那一节——其余的不是答非所问，就是西克自己爱用的断章取义。讲得精彩，满堂起立鼓掌、当场打赏，<b>连击</b>越高钱越多。之后<b>收奉献</b>、<b>电汇</b>德州总部；余款可<b>添置中式陈设</b>或拨给粮食站。</p>
 <p>礼拜堂座位有限，<b>每添一件陈设能多坐 45 人</b>。汇得越多，<b>总部宠信</b>涨得越陡（上限 3000）。宠信用来<b>安排同工</b>：会众靠布道员，信任靠事工干事，审计风险靠律师。本事越大的，每周吃掉的宠信越多。</p>
 <p>第四种同工是<b>抗争同工</b>：他们不去公司门口，而是带着会众在华埠捉拿<b>“犹大的差役”</b>，请他们<b>交出钱囊</b>。放贷公司定期送来<b>慰问金</b>；每拿住一个差役，还额外交一大笔<b>安抚费</b>，都进堂会基金。会众越多，到手的钱越多；反抗越强烈，每位会众自己的奉献也越多。代价是审计风险涨得更快。</p>
 <p>还有一件事：<b>每隔两个月，海军来华埠征兵</b>（四月、六月、八月、十月），名额是会众的一半。会众会把大笔钱财交到你手里求免役，交不够数的送去参军。这笔钱汇多少给德州，同样由你拉滑杆决定；之后会众减半。</p>
 <p><b>你的任期最多两年</b>：从 2049 年三月到 2051 年初，每年十个主日，会众、陈设、同工和账目逐年延续。西克的反扑和总部的配额一年比一年重。</p>
 <p class="res">信任或总部宠信归零、审计风险或西克声势满格，游戏结束。</p>`,

 intro:`<p>American seminaries have been half empty for twenty years. From Boston to San Diego, the pastor in the pulpit is now, more often than not, Chinese.</p>
 <p>You are <b>Pastor John Li</b> of <b>Golden Gate Grace Church</b> on Stockton Street in Chinatown, Branch No. 41 of Lone Star Ministries to All Nations, headquartered in Fort Worth, Texas. Across the bay, <b>Mr. Sick</b> is broadcasting a white-supremacist “theology”.</p>
 <p>Each Sunday’s sermon has three rounds. Sick makes a claim, and you must pick, from several <b>real Bible verses</b>, the one that actually answers him. The others either miss the point or are the proof-texts Sick himself likes to twist. Preach well and the whole hall stands, applauds and tips on the spot; the higher your <b>combo</b>, the more money. Then you <b>take the offering</b> and <b>wire</b> money to headquarters in Texas. Whatever stays can buy <b>Chinese decor</b> for the church or go to the food pantry.</p>
 <p>Seats are limited, and <b>each piece of decor seats 45 more</b>. The more you wire, the faster <b>HQ favour</b> climbs (capped at 3000). Favour pays for <b>staff</b>: evangelists bring in the flock, ministry workers build trust, lawyers hold down audit risk. The more capable they are, the more favour they eat each week.</p>
 <p>A fourth kind of staff is the <b>resistance workers</b>: they do not go to company doors. They lead the flock in catching <b>“the officers of Judas”</b> in Chinatown and have them <b>hand over the purse</b>. The loan companies send <b>consolation money</b> regularly, and each officer caught brings a large extra <b>pacification fee</b>, all into the church fund. The bigger the flock, the more comes in; the fiercer the resistance, the more each member gives in the offering too. The price is that audit risk climbs faster.</p>
 <p>One more thing: <b>every two months the Navy comes to Chinatown to draft recruits</b> (April, June, August, October), and its quota is half the flock. The congregation will press large sums into your hands to be spared; those who cannot pay enough are sent to enlist. A slider again decides how much of that money goes to Texas. Afterwards the flock is halved.</p>
 <p><b>Your term is two years at most</b>: from March 2049 to early 2051, ten Sundays a year, with the flock, decor, staff and accounts carried over from year to year. Sick’s comebacks and the headquarters quota grow heavier each year.</p>
 <p class="res">The game ends if trust or HQ favour hits zero, or if audit risk or Sick’s reach maxes out.</p>`,

 intro:`<p>Há vinte anos que os seminários americanos não enchem. De Boston a San Diego, quem sobe hoje ao púlpito é, na maioria das vezes, um pastor chinês.</p>
 <p>Tu és o <b>pastor John Li</b>, da <b>Igreja da Graça da Golden Gate</b>, na Stockton Street, em Chinatown: a filial n.º 41 dos Ministérios Estrela Solitária para Todas as Nações, com sede em Fort Worth, no Texas. Do outro lado da baía, o <b>Mr. Sick</b> prega na rádio uma “teologia” da supremacia branca.</p>
 <p>O sermão de cada domingo tem três rondas. Sick lança uma tese e tu tens de escolher, entre vários <b>versículos verdadeiros da Bíblia</b>, o único que realmente lhe responde. Os outros ou não vêm a propósito, ou são os textos que o próprio Sick gosta de torcer. Se pregares bem, a sala inteira levanta-se, aplaude e dá gorjeta na hora; quanto maior o <b>combo</b>, mais dinheiro. Depois <b>recolhes a oferta</b> e <b>envias</b> dinheiro para a sede no Texas. O que ficar pode comprar <b>decoração chinesa</b> para a igreja ou ir para o banco alimentar.</p>
 <p>Os lugares são limitados, e <b>cada peça de decoração senta mais 45 pessoas</b>. Quanto mais enviares, mais depressa sobe o <b>favor da sede</b> (máximo 3000). O favor paga a <b>equipa</b>: os evangelistas trazem fiéis, os obreiros criam confiança, os advogados seguram o risco fiscal. Quanto mais capazes, mais favor comem por semana.</p>
 <p>Há um quarto tipo de colaboradores, os da <b>resistência</b>: não vão à porta das empresas. Levam os fiéis a apanhar em Chinatown <b>“os oficiais de Judas”</b> e fazem-nos <b>entregar a bolsa</b>. As empresas de crédito mandam regularmente <b>subsídios de consolação</b>, e cada oficial apanhado traz uma grande <b>taxa de apaziguamento</b> extra, tudo para a caixa da igreja. Quanto mais fiéis, mais dinheiro entra; quanto mais forte a resistência, mais dá cada fiel também na oferta. O preço é o risco fiscal a subir mais depressa.</p>
 <p>Mais uma coisa: <b>de dois em dois meses a Marinha vem a Chinatown recrutar</b> (abril, junho, agosto, outubro), e a quota é metade dos fiéis. Os fiéis vão meter-te grandes quantias nas mãos para escaparem; quem não paga o suficiente vai para a tropa. Um cursor volta a decidir quanto desse dinheiro segue para o Texas. Depois, os fiéis ficam reduzidos a metade.</p>
 <p><b>O teu mandato é de dois anos, no máximo</b>: de março de 2049 ao início de 2051, dez domingos por ano, com fiéis, decoração, equipa e contas a passarem de ano para ano. As investidas de Sick e a quota da sede pesam mais a cada ano.</p>
 <p class="res">O jogo acaba se a confiança ou o favor da sede chegarem a zero, ou se o risco fiscal ou a força de Sick chegarem ao máximo.</p>`,

 fin:[['Remetente de ouro','És transferido para Fort Worth como Supervisor-Geral Adjunto, com a cúpula de vidro mesmo à janela. Pregaste dois anos inteiros que Deus não faz aceção de pessoas, enquanto o livro de contas só conhecia um código postal. A igreja de Chinatown ficou meio vazia.'],['O bom pastor','A rádio de Sick calou-se sem alarde. A fila do banco alimentar encurtou e a fila de domingo cresceu. A sede não gosta dos teus números. Mas na Stockton Street chamam-te “pastor”, e é a sério.'],['O maior templo de Chinatown','Colunas de dragão, telha vidrada, teto em caixotões, chão de tijolo dourado, grous de bronze, cruz dourada. Os autocarros de turistas fazem fila à porta. O guia diz que é “a igreja mais imponente de São Francisco”. Quanto ao banco alimentar, mudou-se no mês passado para o templo budista da rua ao lado.'],['O púlpito venceu, as contas nem por isso','Desfizeste Sick, e isso é verdade. Mas no último dia do mandato os jovens afixaram um gráfico no quadro de avisos: uma linha de Chinatown até ao Texas. Ninguém disse nada.'],['Passaram dois anos','Sick continua no ar, a sede continua a pedir dinheiro e tu continuas no púlpito. O nevoeiro entra pela Golden Gate e volta a sair. A quota do próximo mandato já chegou por fax.']],

 rules:[
  ['两年任期','任期最多两年，2049 到 2051 年初，每年十个主日（三月到十二月），共二十个主日。每个主日依次是：讲道三回合 → 奉献 → 电汇 → 安排同工 → 购置陈设 → 周间事件。每年年终有一次决算，然后带着全部家当进入下一年；配额每年每人多 $10，西克每周的回升每年多 0.5。'],
  ['讲道','每回合五个选项。选对经文：西克声势 −5、信任 +3、会众 +5%、连击 +1。断章取义的经文：西克 +6、信任 −3、连击清零。答非所问的经文：西克 +3、信任 −1、连击清零。避重就轻：西克 +4、信任 −2、连击清零。骂人：西克 −1、会众 +7%、信任 −4、审计风险 +2、连击 +1。第三回合是收尾金句，效果略小。'],
  ['连击打赏','每次续上连击，当场打赏 = 会众 × 2.5 × 连击数 × 打赏加成。连击跨主日累计，但计算打赏时最多按 10 连击算。'],
  ['奉献','安静传袋：每人 $40，信任 +2、风险 −2。恳切呼召：每人 $90，信任 −2。种子信心：每人 $180，信任 −8、风险 +8。实收 = 会众 × 单价 × 讲道感动 × (0.5 + 信任/100)。'],
  ['电汇与总部宠信','每周配额 = $2,000 + 会众 × ($40 + $8 × 当年第几个主日 + $10 × 已过年数)，会众越多配额越高。宠信增加 = k × (1 + k/40)，k 是汇出的千元数，所以汇得越多越划算。未达配额：增幅减半并另有扣减。汇出超过八成：信任 −4、风险 +3。宠信上限 3000，会冲顶时总部截止收款，余款留在华埠。'],
  ['同工','布道员加会众，事工干事加信任，律师减审计风险。五档每周分别消耗宠信 8 / 18 / 35 / 60 / 95。宠信付不起，人就走。第四条线是抗争：五位同工带会众捉拿“犹大的差役”，也就是放贷公司派到华埠的催收员，请他们交出钱囊。每人每周进账 = 会众 × $15 ×（1 + 会众/400）× 本人的系数（0.15 / 0.3 / 0.55 / 1 / 1.6），这个数是基数：慰问金定期到账，每周是基数的六成；另外每位抗争同工每周出手捉拿一次，成功率分别是 30% / 35% / 40% / 45% / 50%，每成功一次，公司额外交来本人基数 2.5 倍的安抚费。两样都直接进堂会基金；每周审计风险各 +1 / 2 / 3 / 4 / 6。他们在任时反抗强度每周各 +0.25 / 0.5 / 0.75 / 1 / 1.5（最高 10），每点强度让每位会众的奉献多 6%；一个都不在任时，强度每周 −2。'],
  ['陈设、座位与粮食站','陈设买下即生效，并出现在画面里。礼拜堂能坐 300 人，每添一件陈设多坐 45 人；周末坐不下的人会离开。粮食站每拨 $3,000：信任 +2、会众 +3，每周最多三次。'],
  ['每周的自然变化','西克声势每周回升 3 + 0.4 × 当年第几个主日 + 0.5 × 已过年数。信任每周下降 2 + 会众/250。审计风险每周上升 2 + 本周汇款/$30,000。所以会众越多越需要事工干事，汇款越大越需要律师。'],
  ['海军征兵','每个主日代表一个月。每隔两个月（四月、六月、八月、十月的主日之后）海军来征兵，名额是会众的一半。会众为了免役交给你一大笔钱：每人 $300 ×（0.5 + 信任/100）。你用滑杆决定汇多少给德州（照常换宠信，没有配额），余下的进堂会基金。之后会众减半，信任 −4，审计风险上升。'],
  ['失败','信任归零、总部宠信归零、审计风险满 100、西克声势满 100，任一发生即告失败。']
 ],

 seenN:(n,N)=>`${n} of ${N} claims met. Each claim you face in a sermon is filed here with the verse that answers it.`,endsN:(n,N)=>`${n} of ${N} endings reached.`,
 rules:[
  ['A two-year term','The term runs two years at most, from 2049 to early 2051: ten Sundays a year (March to December), twenty in all. Each Sunday goes: three sermon rounds → offering → wire → staff → decor → the week’s events. Each year ends with accounts, and then you carry everything into the next; the quota rises by $10 a head each year and Sick’s weekly comeback by 0.5.'],
  ['The sermon','Five options a round. The right verse: Sick’s reach −5, trust +3, flock +5%, combo +1. A twisted proof-text: Sick +6, trust −3, combo reset. A verse beside the point: Sick +3, trust −1, combo reset. Dodging: Sick +4, trust −2, combo reset. Insults: Sick −1, flock +7%, trust −4, audit risk +2, combo +1. Round three is the closing line, with slightly smaller effects.'],
  ['Combo tips','Each time the combo continues, tips on the spot = flock × 2.5 × combo × tip bonus. The combo carries over from Sunday to Sunday, but counts as 10 at most when tips are worked out.'],
  ['The offering','Silent bags: $40 a head, trust +2, risk −2. Earnest appeal: $90 a head, trust −2. Seed faith: $180 a head, trust −8, risk +8. Actual take = flock × rate × sermon impact × (0.5 + trust/100).'],
  ['Wiring and HQ favour','Weekly quota = $2,000 + flock × ($40 + $8 × Sunday of the year + $10 × years served), so a bigger flock means a bigger quota. Favour gained = k × (1 + k/40), where k is thousands wired, so bigger wires pay better. Below quota: the gain is halved, with a penalty. Wiring more than 80%: trust −4, risk +3. Favour is capped at 3000; when a wire would pass the cap, HQ stops accepting and the rest stays in Chinatown.'],
  ['Staff','Evangelists add flock, ministry workers add trust, lawyers cut audit risk. The five tiers cost 8 / 18 / 35 / 60 / 95 favour a week. If the favour cannot be paid, they leave. The fourth track is resistance: five workers who lead the flock in catching “the officers of Judas”, the debt collectors the loan companies send into Chinatown, and having them hand over the purse. Each brings in flock × $15 × (1 + flock/400) × a personal factor (0.15 / 0.3 / 0.55 / 1 / 1.6) a week, That figure is the base: consolation money comes regularly, 60% of the base every week; in addition each resistance worker makes one attempt a week, with a 30% / 35% / 40% / 45% / 50% chance of success, and each catch brings an extra pacification fee of 2.5 times that worker’s base. Both go straight into the church fund, at audit risk +1 / 2 / 3 / 4 / 6 a week. While in post they raise resistance by 0.25 / 0.5 / 0.75 / 1 / 1.5 a week (10 at most), and each point makes every member’s offering 6% bigger. With none of them in post, resistance falls by 2 a week.'],
  ['Decor, seats and the pantry','Decor takes effect when bought and appears in the picture. The sanctuary seats 300, plus 45 for each piece of decor; at the end of the week anyone without a seat leaves. Each $3,000 to the pantry: trust +2, flock +3, three times a week at most.'],
  ['What changes by itself each week','Sick’s reach rises by 3 + 0.4 × Sunday of the year + 0.5 × years served. Trust falls by 2 + flock/250. Audit risk rises by 2 + this week’s wire/$30,000. So a bigger flock needs ministry workers, and bigger wires need lawyers.'],
  ['The Navy draft','Each Sunday stands for a month. Every two months (after the Sundays of April, June, August and October) the Navy comes to draft half the flock. To be spared, the congregation hands you a large sum: $300 a head × (0.5 + trust/100). A slider decides how much goes to Texas (it buys favour as usual, with no quota); the rest joins the church fund. Then the flock is halved, trust falls by 4 and audit risk rises.'],
  ['Losing','You lose if trust hits zero, HQ favour hits zero, audit risk reaches 100, or Sick’s reach reaches 100.']
 ],

 rules:[
  ['Um mandato de dois anos','O mandato dura dois anos, no máximo, de 2049 ao início de 2051: dez domingos por ano (de março a dezembro), vinte ao todo. Cada domingo segue esta ordem: três rondas de sermão → oferta → remessa → equipa → decoração → acontecimentos da semana. Cada ano fecha com contas, e depois levas tudo para o seguinte; a quota sobe $10 por cabeça em cada ano e a recuperação semanal de Sick sobe 0,5.'],
  ['O sermão','Cinco opções por ronda. O versículo certo: força de Sick −5, confiança +3, fiéis +5%, combo +1. Um texto torcido: Sick +6, confiança −3, combo a zero. Um versículo que não vem a propósito: Sick +3, confiança −1, combo a zero. Fugir à questão: Sick +4, confiança −2, combo a zero. Insultos: Sick −1, fiéis +7%, confiança −4, risco fiscal +2, combo +1. A terceira ronda é a frase final, com efeitos um pouco menores.'],
  ['Gorjetas de combo','Sempre que o combo continua, gorjetas na hora = fiéis × 2,5 × combo × bónus de gorjeta. O combo passa de domingo para domingo, mas conta no máximo como 10 no cálculo das gorjetas.'],
  ['A oferta','Sacos em silêncio: $40 por cabeça, confiança +2, risco −2. Apelo sentido: $90 por cabeça, confiança −2. Fé-semente: $180 por cabeça, confiança −8, risco +8. Total real = fiéis × valor × impacto do sermão × (0,5 + confiança/100).'],
  ['Remessa e favor da sede','Quota semanal = $2.000 + fiéis × ($40 + $8 × domingo do ano + $10 × anos cumpridos); mais fiéis, quota maior. Favor ganho = k × (1 + k/40), em que k são os milhares enviados; logo, remessas maiores rendem mais. Abaixo da quota: o ganho cai para metade, com penalização. Enviar mais de 80%: confiança −4, risco +3. O favor tem máximo de 3000; quando uma remessa o ultrapassaria, a sede deixa de aceitar e o resto fica em Chinatown.'],
  ['Equipa','Os evangelistas trazem fiéis, os obreiros dão confiança, os advogados baixam o risco fiscal. Os cinco escalões custam 8 / 18 / 35 / 60 / 95 de favor por semana. Se o favor não chegar, vão-se embora. A quarta linha é a resistência: cinco colaboradores que levam os fiéis a apanhar “os oficiais de Judas”, os cobradores que as empresas de crédito mandam a Chinatown, e a fazê-los entregar a bolsa. Cada um traz fiéis × $15 × (1 + fiéis/400) × um fator pessoal (0,15 / 0,3 / 0,55 / 1 / 1,6) por semana, Esse valor é a base: o subsídio de consolação chega regularmente, 60% da base todas as semanas; além disso, cada colaborador da resistência faz uma tentativa por semana, com 30% / 35% / 40% / 45% / 50% de probabilidade de êxito, e cada captura traz uma taxa de apaziguamento extra de 2,5 vezes a base desse colaborador. Ambos vão diretamente para a caixa da igreja, com risco fiscal +1 / 2 / 3 / 4 / 6 por semana. Em funções, sobem a resistência 0,25 / 0,5 / 0,75 / 1 / 1,5 por semana (máximo 10), e cada ponto aumenta 6% a oferta de cada fiel. Sem nenhum deles em funções, a resistência desce 2 por semana.'],
  ['Decoração, lugares e banco alimentar','A decoração tem efeito ao ser comprada e aparece na imagem. O santuário tem 300 lugares, mais 45 por cada peça de decoração; no fim da semana, quem não tem lugar vai-se embora. Cada $3.000 para o banco alimentar: confiança +2, fiéis +3, no máximo três vezes por semana.'],
  ['O que muda sozinho em cada semana','A força de Sick sobe 3 + 0,4 × domingo do ano + 0,5 × anos cumpridos. A confiança desce 2 + fiéis/250. O risco fiscal sobe 2 + remessa da semana/$30.000. Assim, um rebanho maior pede obreiros, e remessas maiores pedem advogados.'],
  ['O recrutamento da Marinha','Cada domingo representa um mês. De dois em dois meses (depois dos domingos de abril, junho, agosto e outubro) a Marinha vem recrutar metade dos fiéis. Para escaparem, os fiéis entregam-te uma grande quantia: $300 por cabeça × (0,5 + confiança/100). Um cursor decide quanto segue para o Texas (compra favor como sempre, sem quota); o resto entra na caixa da igreja. Depois os fiéis ficam reduzidos a metade, a confiança desce 4 e o risco fiscal sobe.'],
  ['A derrota','Perdes se a confiança chegar a zero, se o favor da sede chegar a zero, se o risco fiscal chegar a 100 ou se a força de Sick chegar a 100.']
 ],

PACK.zh.ui.aria='从讲台望向坐满会众的礼拜堂';PACK.en.ui.aria='The packed sanctuary seen from the pulpit';PACK.pt.ui.aria='O santuário cheio visto do púlpito';
Object.assign(PACK.zh,{"CLAIMS": [["上帝亲手为各族划定疆界——祂的本意就是各族分开，各过各的。", "「祂从一本造出万族。」保罗说疆界，是为了叫人寻求神，不是叫人砌墙。同出一本的，没有谁比谁更“本”。"], ["有些族裔从挪亚的时代起就背着咒诅，这是圣经写明的。", "那句话是挪亚酒醒后对迦南说的，经文里没有一个字提到肤色。倒是第一章写明：人人按着神的形像受造。"], ["各族应当各自聚会。混在一起敬拜，是混乱，不是合一。", "约翰看见的是各国、各族、各民、各方的人，站在同一个宝座前。天上的座次表，西克牧师改不了。"], ["华人站上美国的讲坛，是一场属灵的入侵。", "安提阿教会——头一间差派宣教士的教会——讲台上站着称呼尼结的西面、古利奈人路求。多族裔的讲坛不是入侵，是起初的样式。"], ["跨族通婚违背神的心意，会玷污圣洁的后裔。", "米利暗因摩西娶了古实女子而毁谤他。结果受管教的，是米利暗。"], ["怜悯要先给自己人。外人，排在后面。", "耶稣偏偏选了一个“外人”——撒玛利亚人——来作邻舍的榜样。律法也说：寄居的，要看他如本地人。"], ["这片土地是神专门应许给我们这一族的。", "「我们却是天上的国民。」在地上，人人都是客旅、是寄居的——包括先到的，也包括后到的。"], ["福音是西方文明的果实。离开了西方，就没有基督教。", "埃塞俄比亚的太监受洗时，欧洲还没有一间教堂。福音从耶路撒冷出发，向南到了非洲，向东在公元635年到了长安。"], ["对不同出身的会友区别对待，是牧养的智慧。", "「按着外貌待人，便是犯罪。」彼得在哥尼流家里才明白：神是不偏待人的。"], ["公义是世俗的议程。讲台只该讲灵魂得救，别的少管。", "「惟愿公平如大水滚滚。」行公义、好怜悯、存谦卑的心与神同行——先知没有把它们拆开卖。"], ["耶稣长着我们西方人的样貌，这不是偶然。", "祂生在伯利恒，逃难到埃及，长在拿撒勒——一个中东的木匠。「无佳形美容」，圣经压根没有记祂的肤色，是后来的画师替祂挑的。"], ["不同种族的灵魂，在神面前分量不同。", "「神爱世人。」这一节没有脚注，没有附表，也没有汇率。"], ["移民潮是神对这个国家的审判。", "路得是摩押女子，一个逃荒的外邦寡妇。她后来成了大卫的曾祖母，名字写进了耶稣的家谱。神管这叫恩典，不叫审判。"], ["教会的领袖，必须出自“建国的血脉”。", "作监督的条件：无可指责、有节制、善于教导、不贪财……一条一条念下来，没有一条是血脉。倒是“不贪财”那条，值得大家——包括我——多念两遍。"], ["他们的语言，不配用来敬拜。", "帕提亚人、玛代人、埃及人、阿拉伯人——各人都听见门徒用自己的乡谈，讲说神的大作为。圣灵降临的第一件事，就是不嫌口音。"], ["历史上的奴役，是神许可的秩序。", "「我的百姓所受的困苦，我实在看见了。」出埃及记的神站在为奴的人那一边。保罗也叫腓利门接纳阿尼西母：不再是奴仆，乃是亲爱的兄弟。"], ["我们的文化，就是基督教本身。", "耶路撒冷会议早就定了案：外邦人信主，不必先变成犹太人。那么今天信主，也不必先变成任何别的人。"], ["如今神的选民，就是我们这个民族。", "「你们既属乎基督，就是亚伯拉罕的后裔。」凭的是应许，不是户籍，更不是族谱网站的检测报告。"], ["强者治理弱者，是创造的法则。", "「外邦人有尊为君王的治理他们……只是在你们中间不是这样。」谁愿为首，就作众人的仆人。这是主亲口定的法则。"], ["与异族同桌吃饭，会败坏信仰。", "彼得因为怕人，退出了外邦人的饭桌。保罗当面抵挡他，说他「与福音的真理不合」。分桌吃饭这件事，使徒时代就判过了。"], ["这些外来的牧师，读不懂“我们的”圣经。", "圣经是用希伯来文、亚兰文和希腊文写的。对今天在座的每一位——也包括西克牧师——它都是译本。没有谁是它的房东。"], ["贫穷的族群，是因为不蒙福。", "「神岂不是拣选了世上的贫穷人，叫他们在信上富足吗？」耶稣开口讲的头一个“有福”，是给贫穷的人。"], ["“爱邻舍”说的是爱同胞。别的人不算。", "「你们若单爱那爱你们的人，有什么赏赐呢？就是税吏不也是这样行吗？」只爱自己人，耶稣说那叫及格线以下。"], ["圣经吩咐：不可与外邦人相交。", "「祂使我们和睦，将两下合而为一，拆毁了中间隔断的墙。」基督拆了的墙，西克牧师想重砌，还想让我们出砖钱。"], ["一个国家只有一种人，才有平安。", "「我的殿必称为万民祷告的殿。」耶稣洁净圣殿、推倒桌子的时候，口里引的正是这一句。"], ["我们不恨任何人，只是主张各归各位。", "「人若说我爱神，却恨他的弟兄，就是说谎话的。」如果“各归各位”的意思是请弟兄坐到门外去，那它就是恨，只是打了领带。"], ["初代教会是纯一的，没有这些杂色。", "说希腊话的寡妇在饭食上被忽略了。使徒没有叫他们另立一间教会，而是选出七位执事——七个，全是希腊名字。"], ["有些城、有些人，本就不配得怜悯。", "约拿也是这么想的，气得坐在城外等尼尼微倒霉。神问他：「这大城里有十二万多人，我岂能不爱惜呢？」"], ["末世的大复兴，只属于一个民族。", "「使万民作我的门徒。」「这天国的福音要传遍天下，对万民作见证。」万民两个字，主说了不止一遍，怕的就是有人装没听见。"], ["讲台上带着口音，就没有权柄。", "摩西说自己拙口笨舌。神回答：「造人口的是谁呢？」保罗也说，他传道不用高言大智。权柄不在舌头卷不卷。"]], "CV": [["《使徒行传》17:26", "他从一本造出万族的人，住在全地上"], ["《创世记》1:27", "神就照着自己的形像造人，乃是照着他的形像造男造女"], ["《启示录》7:9", "有许多的人，没有人能数过来，是从各国、各族、各民、各方来的，站在宝座和羔羊面前"], ["《使徒行传》13:1", "在安提阿的教会中，有几位先知和教师，就是巴拿巴和称呼尼结的西面、古利奈人路求"], ["《民数记》12:1", "摩西娶了古实女子为妻。米利暗和亚伦因他所娶的古实女子就毁谤他"], ["《利未记》19:34", "和你们同居的外人，你们要看他如本地人一样，并要爱他如己"], ["《腓立比书》3:20", "我们却是天上的国民"], ["《使徒行传》8:36", "太监说：看哪，这里有水，我受洗有什么妨碍呢？"], ["《雅各书》2:9", "但你们若按外貌待人，便是犯罪，被律法定为犯法的"], ["《阿摩司书》5:24", "惟愿公平如大水滚滚，使公义如江河滔滔"], ["《以赛亚书》53:2", "他无佳形美容；我们看见他的时候，也无美貌使我们羡慕他"], ["《约翰福音》3:16", "神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生"], ["《路得记》1:16", "你的国就是我的国，你的神就是我的神"], ["《提摩太前书》3:2", "作监督的，必须无可指责……有节制，自守，端正，乐意接待远人，善于教导"], ["《使徒行传》2:8", "我们各人怎么听见他们说我们生来所用的乡谈呢？"], ["《出埃及记》3:7", "我的百姓在埃及所受的困苦，我实在看见了"], ["《使徒行传》15:19", "所以据我的意见，不可难为那归服神的外邦人"], ["《加拉太书》3:29", "你们既属乎基督，就是亚伯拉罕的后裔，是照着应许承受产业的了"], ["《马可福音》10:43", "只是在你们中间，不是这样。你们中间，谁愿为大，就必作你们的用人"], ["《加拉太书》2:11", "后来，矶法到了安提阿，因他有可责之处，我就当面抵挡他"], ["《启示录》5:9", "从各族、各方、各民、各国中买了人来，叫他们归于神"], ["《雅各书》2:5", "神岂不是拣选了世上的贫穷人，叫他们在信上富足"], ["《马太福音》5:46", "你们若单爱那爱你们的人，有什么赏赐呢？就是税吏不也是这样行吗？"], ["《以弗所书》2:14", "因他使我们和睦，将两下合而为一，拆毁了中间隔断的墙"], ["《以赛亚书》56:7", "因我的殿必称为万民祷告的殿"], ["《约翰一书》4:20", "人若说我爱神，却恨他的弟兄，就是说谎话的"], ["《使徒行传》6:1", "有说希腊话的犹太人向希伯来人发怨言，因为在天天的供给上忽略了他们的寡妇"], ["《约拿书》4:11", "何况这尼尼微大城，其中不能分辨左手右手的有十二万多人……我岂能不爱惜呢？"], ["《马太福音》28:19", "所以，你们要去，使万民作我的门徒"], ["《出埃及记》4:11", "耶和华对他说：谁造人的口呢？"]], "DM": [["《申命记》7:3", "不可与他们结亲。不可将你的女儿嫁他们的儿子，也不可叫你的儿子娶他们的女儿"], ["《创世记》9:25", "迦南当受咒诅，必给他弟兄作奴仆的奴仆"], ["《马太福音》15:24", "我奉差遣不过是到以色列家迷失的羊那里去"], ["《马太福音》15:26", "不好拿儿女的饼丢给狗吃"], ["《哥林多后书》6:14", "你们和不信的原不相配，不要同负一轭"], ["《创世记》11:9", "因为耶和华在那里变乱天下人的言语，使众人分散在全地上"], ["《罗马书》13:1", "在上有权柄的，人人当顺服他"], ["《以弗所书》6:5", "你们作仆人的，要惧怕战兢，用诚实的心听从你们肉身的主人"], ["《利未记》19:19", "不可用两样搀杂的种种你的地，也不可用两样搀杂的料作衣服穿在身上"], ["《提摩太前书》5:8", "人若不看顾亲属，就是背了真道，比不信的人还不好"], ["《申命记》32:8", "至高者将地业赐给列邦，将世人分开"], ["《马太福音》10:5", "外邦人的路，你们不要走；撒玛利亚人的城，你们不要进"], ["《申命记》14:2", "耶和华从地上的万民中拣选你特作自己的子民"]], "DX": [["《诗篇》23:1", "耶和华是我的牧者，我必不至缺乏"], ["《传道书》3:1", "凡事都有定期，天下万务都有定时"], ["《腓立比书》4:13", "我靠着那加给我力量的，凡事都能做"], ["《马太福音》7:1", "你们不要论断人，免得你们被论断"], ["《马太福音》6:33", "你们要先求他的国和他的义，这些东西都要加给你们了"], ["《罗马书》8:28", "万事都互相效力，叫爱神的人得益处"], ["《箴言》22:6", "教养孩童，使他走当行的道，就是到老他也不偏离"], ["《诗篇》119:105", "你的话是我脚前的灯，是我路上的光"], ["《以赛亚书》40:31", "但那等候耶和华的必从新得力"], ["《马太福音》11:28", "凡劳苦担重担的人可以到我这里来，我就使你们得安息"], ["《玛拉基书》3:10", "你们要将当纳的十分之一全然送入仓库"], ["《路加福音》6:38", "你们要给人，就必有给你们的"], ["《哥林多后书》9:7", "因为捐得乐意的人是神所喜爱的"], ["《箴言》16:18", "骄傲在败坏以先，狂心在跌倒之前"], ["《箴言》15:1", "回答柔和，使怒消退；言语暴戾，触动怒气"], ["《传道书》1:2", "虚空的虚空，虚空的虚空，凡事都是虚空"], ["《箴言》3:5", "你要专心仰赖耶和华，不可倚靠自己的聪明"], ["《帖撒罗尼迦前书》5:16", "要常常喜乐"], ["《约翰福音》11:35", "耶稣哭了"], ["《创世记》1:1", "起初，神创造天地"], ["《约伯记》1:21", "赏赐的是耶和华，收取的也是耶和华"], ["《箴言》17:22", "喜乐的心乃是良药"], ["《提摩太前书》5:23", "因你胃口不清，屡次患病，再不要照常喝水，可以稍微用点酒"], ["《传道书》12:12", "著书多，没有穷尽；读书多，身体疲倦"], ["《箴言》21:9", "宁可住在房顶的角上，不在宽阔的房屋与争吵的妇人同住"], ["《哈巴谷书》2:20", "惟耶和华在他的圣殿中，全地的人都当在他面前肃敬静默"], ["《民数记》22:28", "耶和华叫驴开口，对巴兰说：我向你行了什么，你竟打我这三次呢？"]], "EVA": [["今天不谈这个", "“弟兄姊妹，我们只谈平安喜乐，不谈外面的纷争。”"], ["含糊带过", "“这是很深的神学问题，学者们各有看法，我们存谦卑的心就好。”"], ["讲讲停车位", "“合一很重要。说到合一，本周停车场请大家互相礼让。”"], ["强调自己是公民", "“我有护照，我纳税，我很爱这个国家。”然后匆匆进入报告事项。"], ["改谈婚姻营会", "“家庭是根基。下月有夫妻营会，早鸟价到周三。”"], ["各打五十大板", "“两边都有道理，我们要有智慧，也要有爱心，阿们？”"], ["谈谈房价", "“说到土地，湾区的房价确实需要代祷。”"], ["感谢宣教士", "“我们感谢历代宣教士的摆上。”——句句属实，却答非所问。"], ["顺势下台阶", "“他说得也不全错。我们还是多讲得救吧。”"], ["念报告事项", "“在回应之前，先提醒：姊妹会的月饼预订今天截止。”然后就没有然后了。"], ["请大家默祷", "“让我们安静三分钟。”三分钟后，你直接唱了散会诗。"], ["推给下周", "“这个题目很重要，我下周专题分享。”你上周也是这么说的。"], ["讲一个笑话", "你讲了一个关于挪亚方舟上两只啄木鸟的笑话。笑的人不多。"], ["谈属灵争战的“原则”", "“我们不与属血气的争战。”——所以你什么也没争。"], ["引一句鸡汤", "“爱能遮掩许多的罪。”你把这句当成了窗帘。"], ["播放见证视频", "灯暗了，放了一段总部制作的十二分钟募款见证片。"]], "ATK": [["揭他老底", "“西克？他曾祖父下船时连英文都不会说！一个穿西装的骗子罢了！”"], ["以咒还咒", "“谁受咒诅？我看是他那间靠仇恨吃饭的教会受了咒诅！”"], ["嘲笑他的会众", "“他那里的人，只配坐在一起互相取暖，因为没别人肯挨着他们坐。”"], ["宣称自己才是正统", "“如今是我们在撑着美国的教会！没有我们，他们的礼拜堂早改成健身房了！”"], ["人身攻击", "“他自己离过两次婚，还有脸站讲台？”"], ["号召抵制", "“从今天起，谁也别光顾他会友开的店！”"], ["抢应许", "“淘金、修铁路的是谁？这地要论功，也轮不到他！”"], ["文明比拼", "“论文明？我们写史书的时候，他的祖先还在树林里！”"], ["点名羞辱", "把西克教会几位执事的名字投上大屏幕，请会众“认清这些面孔”。"], ["宣布属灵争战", "“西克就是那恶者的差役！把手举起来，咒诅他的事工！”"], ["模仿他的口音", "你捏着鼻子学了一段他的南方腔，全场笑翻。"], ["攻击他的学历", "“他那张神学文凭，是函授的！函授学校去年还倒闭了！”"], ["嘲笑他的发型", "“一个把头发吹成那样的人，你指望他把经文读成什么样？”"], ["诅咒他的收视率", "“我奉主的名宣告：他的直播间从今晚起只剩他妈妈一个观众！”"], ["暗示他有丑闻", "“关于他那位女秘书，我今天不方便说。懂的都懂。”"], ["比拼人数", "“他那里坐多少人？我们这里坐多少人？神站在哪边，数一数就知道！”"], ["比拼奉献", "“他一年的奉献，还不够我们买一对柱子！这叫蒙福，他那叫破产！”"], ["叫他滚", "“这种人不配留在加州！叫他回他的山沟里去！”"], ["给他起外号", "“从今天起，我们不叫他西克牧师，就叫他‘有病’——脑子有病，心也有病！”"], ["预言他下地狱", "“我看见了，我在灵里看见了——那边已经给他留好位子了！”"], ["号召网暴", "“散会以后，每人去他的频道留十条差评。这叫行道！”"], ["羞辱他的会友", "“去他那里聚会的，都是些考不上大学的！”"], ["翻祖宗旧账", "“他的姓氏我查过了，祖上是给人看牲口的！”"], ["摔麦克风", "你大吼一声“撒但退去！”，把麦克风摔在讲台上，啸叫声响彻礼拜堂。"]], "ZW": ["他把福音当围墙用，可福音生来是一扇门。", "十字架是一横一竖两根木头——他只肯要竖的那根，好把自己垫高。", "五旬节那天，圣灵叫人说万国的方言，没叫人查护照。", "他说要保卫基督教。可基督从不需要保镖，祂要的是门徒。", "天国的筵席，不设包厢。", "他数算血统，神数算头发——连他头上的，也都被数过了。", "有人把自己的肤色读进圣经，再从圣经里读出来，就说那是启示。", "巴别塔叫人分散，五旬节叫人相聚。他站错了山头。", "他怕讲台上换了面孔。可讲台上该被看见的，从来不是牧师的脸。", "他的神太小了，小得只装得下一个族谱。", "生命册上只登记名字，没有“族裔”那一栏。", "他要一间纯净的教会。可教会生来是医院，不是陈列室。", "主为门徒洗脚的时候，没有先问他们是哪里人。", "他守着大门挑客人，忘了自己也是被请来的。", "施洗的水不认肤色，圣餐的饼不问籍贯。", "他把“我们”画得那么小，小到连耶稣都得在门外排队。", "好牧人撇下九十九只去找那一只。他是撇下那一只，给九十九只发会员卡。", "骄傲把天使变成了魔鬼。把一个民族捧上天，下场也差不到哪里去。", "血统若是能救人，耶稣何必流自己的血。", "福音要是只属于一种人，它早就失传在某个村子里了。", "他站在祖先的肩膀上看别人矮。可在十字架底下，人人都是跪着的。", "爱里没有惧怕。他的讲章里除了惧怕，什么都没有。", "他把教会的门槛修得很高，耶稣进来是弯着腰给人洗脚的。", "保罗说“我们”，指的是犹太人和外邦人。他说“我们”，指的是他和镜子。", "天上的诗班，没有一个声部是独唱。", "他以为自己在守卫葡萄园。主人回来，要问的是他为什么把工人赶走。", "有人担心教会变了颜色。教会唯一该有的颜色，是被洗过的那一种。", "神造人用的是尘土。哪一国的尘土，祂没有说，因为不重要。", "他讲了一辈子“我们的传统”。可最老的传统是：万民。", "仇恨是很省力的神学，不用读经，只用照镜子。", "他要把麦子和稗子分开——可主说过，那不是他的差事。", "在基督里，没有“他们”这个代词。", "他怕别人抢了他的位子。在天国，位子是主摆的，而且祂喜欢把末后的摆到前头。", "人看外貌，耶和华看内心。他连外貌都只看一种。", "他讲台下的人越坐越像，讲台上的话就越讲越窄。", "我们不必证明自己配站在这里。配不配，是恩典说了算。"], "ZF": ["我们要彼此相爱，阿们。", "愿神光照他。", "这是一个复杂的时代。", "我们为他祷告。", "让我们回到经文。", "各人有各人的看法。", "神学院教过相关课程。", "今天时间有限。", "这个话题很敏感。", "我们不论断人。", "总之，要有爱心。", "这一点留给大家会后思想。", "呃……刚才讲到哪里了？", "凡事都有两面。"], "ZH": ["这种人，地狱都要给他单开一层！", "他讲道的水平，还不如我家楼下的鹦鹉！", "他该回他祖先来的那条船上去！", "弟兄姊妹，把他的频道举报到封号为止！", "他那张脸，看着就不像得救的！", "我劝他先去验个DNA，别吓着自己！", "蠢人读经，越读越蠢！", "愿他的麦克风永远啸叫！", "他要是真懂圣经，我就把这本吃下去！", "他的教会迟早关门，我去给它贴封条！", "愿他的讲章被狗叼走，狗都读不下去！", "他要是进了天堂，我就去站门口抗议！", "他那不叫教会，叫同乡会——还是收会费的那种！", "我说他是瞎眼领路的，都算抬举他，他连路都不认识！", "他上辈子一定是法利赛人里最没出息的那个！", "谁再转发他的视频，我亲自上门收回你的洗礼证！", "他读的不是圣经，是他家的户口本！", "他那张嘴，圣灵听了都要绕道走！", "我愿意为他祷告——求主让他失声三年！", "把他的名字写下来，贴在鞋底，一路踩回家！", "他那点会众，还不够我们这里上一趟洗手间的人数！", "他要是来敲我们的门，就说牧师不在，狗在！", "西克的西，是西贝货的西——假的！", "让他来！让他当面来！我用圣经砸他——我是说，用精装的那本！"], "SHOUT": ["阿们！", "讲得好！", "讲得啱！", "Preach!", "¡Amén!", "哈利路亚！", "说得太对了！", "再讲一句！", "牧师威武！", "痛快！", "就是这个理！", "Amen, pastor!", "讲到我心里了！", "记下来记下来！", "这句要印在周报上！", "掌声！", "好！！", "牧师再来！", "感谢主！", "太解气了！", "阿们阿们阿们！", "一针见血！", "我录下来了！", "句句是真理！", "服了！", "Say it again!", "姊妹们站起来！", "给牧师倒茶！", "这才叫讲道！", "回家讲给我老公听！"], "R_G": ["你打开圣经，一句一句讲。台下先是很静，然后有人喊“阿们”，接着整堂人都站了起来。", "经文念完，你没有加一句评语。不需要。掌声从后排滚到前排。", "一位老姊妹扶着椅背站起来，颤着声音说“阿们”，全堂跟着站了起来。", "你讲得不快。每一节经文落下去，都像钉子钉在木头上。", "讲到一半，后排有人用英语喊了一声，前排用粤语接了一句，全场笑着鼓起掌来。", "你合上圣经。台下几百人起立，掌声久久不落。", "这一段明天会被剪成短视频。但此刻，它只是一群人听见了真话。", "诗班的指挥忘了自己还举着手，站在那里拼命点头。"], "R_E": ["讲章四平八稳。台下有人低头看手机。", "前排一位长老摘下眼镜，慢慢擦了很久。", "散会时，一位姊妹问你：“牧师，他说的那些话，我们到底该怎么答？”", "礼拜堂里很安静。是那种失望的安静。", "青年团契那一排，有人把周报折成了纸飞机。", "司琴等了很久，不知道该不该弹下一首。"], "R_A": ["全场哄笑、起立、跺脚，片段当晚就上了热门。只是你用来打他的不是经文，是和他同一种火气。", "掌声雷动，口哨四起。后排一位老执事没有鼓掌，慢慢合上了圣经。", "年轻人笑得前仰后合，纷纷举起手机。一位带孩子的母亲捂住了孩子的耳朵。", "痛快是真痛快。只是讲台上那本摊开的圣经，这一段你一眼也没看。", "全堂起立叫好。你忽然想到：西克的会众，大概也是这样为他叫好的。", "笑声震得灯笼直晃。司库在角落里低声说：“这段播出去，律师要找上门的。”"], "R_M": ["台下一片哗然——这不正是西克上周引的那一节吗？你替他把弹药送上了门。", "吴长老猛地抬起头。这节经文是真的，可断章取义的用法，正是西克的拿手好戏。", "青年团契有人小声说：“牧师，这句……是对面的论据吧？”", "经文念完，全堂沉默。阿杰在手机上搜了一下上下文，脸色变了。", "西克的人把这一段录了下来，标题都替你想好了：《连金门的牧师也承认》。"], "R_X": ["经文是好经文，只是答非所问。台下有人礼貌地点头，更多的人在翻周报。", "你念得字正腔圆。可西克的话，还原封不动地悬在礼拜堂上空。", "一位姊妹低声问邻座：“这跟刚才那个问题，有什么关系？”", "全堂安静了三秒。司琴以为讲完了，弹了一个和弦。", "这节经文很适合印在书签上，不适合今天。"], "O0": ["奉献袋安静地传过每一排。", "没有人催促。硬币落进布袋，声音很轻。", "一个小女孩踮着脚，把攥得发热的一块钱放了进去。"], "O1": ["有人擦眼泪，有人看手表。", "你讲了屋顶漏水，讲了冷气账单。有人点头，有人叹气。", "十分钟讲成了十八分钟。奉献袋传了两轮。"], "O2": ["排行榜滚动着名字。后排一位洗碗工掏出了本周的房租。", "“还有没有弟兄姊妹愿意挑战榜首？”大屏幕上烟花特效炸开。", "二维码亮了整整二十分钟。一位老人问邻座：“翻倍，是翻给谁？”"], "MEMOS": ["总部新圣殿的玻璃穹顶，尚差四百万。金门区是我们的“西岸粮仓”。", "沃思堡的弟兄们每晨五点为你们的奉献数字祷告。数字，是会说话的。", "周总监督的事工专机需要更换引擎。翅膀，是福音的脚踪。", "本季度西岸各堂排名已发。金门堂目前第七。第七，不是一个得胜的数字。", "请注意：“本地开支”一栏过高的分堂，将接受属灵与财务双重辅导。", "总部牧场的祷告山正在加建缆车，以便年长的大额奉献者登山。", "感恩月将至。去年休斯敦堂单周电汇四十万。愿这数字激励你们。", "周总监督将亲临西岸。届时请以一张大号支票（道具即可，金额须真）迎接。", "年终决算在即。总部提醒：信心是没有上限的，配额也是。", "总监督说：“又良善又忠心的仆人，是看得见流水单的。”", "总部游泳池——即“大型浸礼池”——的恒温系统故障，急需代祷与代付。", "听说贵堂添置了不少陈设。总部提醒：装饰是地上的，电汇是天上的。", "周师母的“敬虔妇女”护肤系列即将上市，各堂认购额度另函通知。", "总部决定为总监督立一尊铜像，以“激励后人”。金门堂认捐：左臂。", "达拉斯堂本周电汇已到账，奥斯汀堂已到账，圣安东尼奥堂已到账。就差西岸了。", "总部律师提醒：对外请一律称“奉献”，不要称“汇款”；称“异象”，不要称“预算”。", "孤星神学院招生不足，请贵堂推荐学员十名，学费可由贵堂代缴。", "总监督新书《信心的翅膀》每堂配售五百册。书款请随本周电汇一并汇出。", "牧场新添纯种马十二匹，用于“青年门徒骑术营”。马的名字都取自十二使徒。", "周总监督昨夜得了一个梦：一条金色的河从旧金山流向德克萨斯。"], "CHAT": [["陈伯（华埠住了六十年）", "“牧师，你今天讲的，我听了一辈子教会，头一回听人讲得这么明白。”"], ["陈伯", "“牧师，骂人我也会。我来教会，是想听点我不会的。”"], ["黄太（招待组）", "“今天又不够椅子啦！过道都站满了，消防局来了要罚的。”"], ["黄太", "“牧师，那对龙柱……我婆婆说，启示录里的龙是那个。我不敢讲，我只是转达。”"], ["阿杰（青年团契）", "“牧师，你那段连击我剪好了，配了鼓点，已经三十万播放。”"], ["阿杰", "“牧师，西克那边的年轻人私信我，问能不能来看看。我说来呗，有饭。”"], ["司库梁姊妹", "“牧师，这个月汇去德州的，是留在堂里的四倍。我只是报数字。”"], ["司库梁姊妹", "“账我都贴在布告栏了。有人看了两眼，点点头走了。这样最好。”"], ["司库梁姊妹", "“牧师，银行又来电话了。我说您在祷告。您最好真的在祷告。”"], ["玛丽亚（清洁工，说西班牙语）", "“Pastor，粮食站的米，我带了两袋给楼上的邻居。她下周想来。”"], ["玛丽亚", "“Pastor，粮食站这周没开门。我不是抱怨，我只是问问。”"], ["吴长老", "“堂里布置得越来越像样了。只是别忘了，会幕最要紧的那件家具，是空着的施恩座。”"], ["吴长老", "“牧师，奉献的事，催得太紧了。羊毛是要剪的，可不能连皮剪。”"], ["吴长老", "“今天这篇道，可以。”——这是他三十年来说过的最高评价。"], ["戴维（白人，娶了广东太太）", "“李牧师，我岳母终于肯承认我是家里人了。她说是听了你上周的道。”"], ["戴维", "“牧师，你讽刺西克的那几句……我父亲就在他的教会。我今天没敢转发。”"], ["小敏（会计系学生）", "“牧师，我做了个表，把每周奉献和电汇画成曲线。您想看吗？”"], ["小敏", "“牧师，粮食站的账我帮忙对过了，一分不差。我想受洗。”"], ["游客（拿着自拍杆）", "“请问这里是教堂还是庙？可以烧香吗？门票多少？”"], ["邮差老周", "“德州来的挂号信，又是催款单吧？我每周都送，信封越来越厚。”"], ["邮差老周", "“德州寄来个大箱子，说是奖给你们的——一尊总监督的半身像。放哪儿？”"], ["诗班指挥", "“牧师，下次讲到精彩处，给我个眼神，我让诗班垫一个和弦。”"], ["卖叉烧包的何姨", "“牧师，今天散会出来的人个个眉开眼笑，包子多卖了两笼。”"], ["卖叉烧包的何姨", "“今天出来的人都不讲话。牧师，你是不是讲得太闷？”"], ["一位陌生的老先生", "他握了握你的手，什么也没说，往奉献箱里放了一个信封。里面是一张三十年前的洗礼证。"], ["主日学的孩子", "“牧师，西克牧师是坏人吗？老师说我们要为他祷告。那你为什么骂他？”"], ["主日学的孩子", "“牧师，那个大鼓可以敲吗？就敲一下。”"], ["黄太", "“牧师，辛苦了，喝口茶。”她把保温杯塞到你手里。"]], "COLE_DN": ["西克在广播里沉默了十秒钟，然后开始播放赞美诗。", "西克本周的节目改成了“听众来信”。来信只有一封，是他太太写的。", "西克宣布“休假灵修”一周。", "据说西克的两位执事递了辞呈，其中一位留言：“我回去把那段经文读了三遍。”", "西克在节目里引了你的话想反驳，引到一半，自己停住了。", "“纯正遗产之声”本周掉了四万订阅。"], "COLE_UP": ["西克在广播里大笑：“你们听听，金门那位连一句经文都答不上来。”", "西克把你回避的片段循环播放了一整周。", "西克的订阅数又涨了。他在奥克兰租下了一间更大的礼堂。", "西克宣布开设“血统与圣经”系列讲座，门票三天售罄。", "西克在节目里说：“他只会骂人。骂人，我们比他在行。”", "“纯正遗产之声”买下了湾区公路边的十二块广告牌。"], "ITEMS": [["中国结一对", ""], ["「福」「音」斗方", ""], ["宫灯串", ""], ["大红灯笼一对", ""], ["锦鲤缸", ""], ["祥云纹红毯", ""], ["紫砂壶（润喉）", ""], ["文房四宝", ""], ["洒金折扇", ""], ["书法对联", ""], ["剪纸窗花", ""], ["铜香炉", "长老咳嗽"], ["青花瓷瓶一对", ""], ["惊堂木", ""], ["开道铜锣", ""], ["梅兰竹菊条屏", ""], ["「荣神益人」金匾", ""], ["大红鼓", ""], ["红绸帷幔", ""], ["山水屏风", "挡住账房"], ["铜鹤一对", ""], ["石狮一对", ""], ["六角宫灯一对", ""], ["祥云描金壁画", ""], ["金砖墁地", ""], ["盘龙金柱一对", ""], ["景泰蓝莲花彩窗", ""], ["金丝楠木雕花讲台", ""], ["藻井彩绘天花", ""], ["琉璃瓦讲坛华盖", ""], ["鎏金十字架", ""]], "EVENTS": [["《湾区纪事》的记者混在会众里坐了三个主日。", "头版标题：《华埠的奉献，德州的穹顶》。", "报道出来了，标题是《讲坛上最清醒的声音》。"], ["西克牧师在直播里向你下战书，要“公开辩论谁才是真教会”。", "你的讲章片段被剪进了回应视频，转发四十万次。", "你没有像样的讲章可供回应，他的订阅数又涨了。"], ["华埠长者粮食站门口排起了长队。", "粮食站货架是满的。一位老太太往奉献箱里放了两枚硬币。", "货架是空的。有人望着堂里新添的陈设，小声问：“我们的钱都去哪儿了？”"], ["青年团契的会计系学生举手发问：“牧师，财务报告什么时候公布？”", "你说“下次同工会再议”。她把这句话发到了群里。", "你把报表投上了屏幕。台下有人鼓掌。"], ["有消息说，西克的会众每周也在电汇——汇往阿肯色州的某处“遗产基金”。", "你忽然觉得，两条电汇线路在地图上画出来，形状有点像。", ""], ["一位从西克教会出来的年轻白人弟兄，坐在了最后一排。", "他听了十分钟你骂人的话，起身走了：“这里和那边，口气一样。”", "散会后他留下来帮忙收椅子。下周他带来了两个朋友。"], ["银行合规部来电，“例行了解”贵堂近期的大额跨州汇款用途。", "对方问得很细。你发现总部从未给过你任何收据。", "你如实说明，并附上了公开的财务报告。对方道谢后挂断。"], ["格兰特大道的灯笼亮了，中秋联合崇拜座无虚席。", "粤语、国语、英语、西班牙语的诗班轮流献唱。", ""], ["半夜，有人在礼拜堂大门上喷了漆。监控里是西克教会的车。", "第二天一早，街坊自发来刷墙。刷子不够，有两个少年默默接了过去——他们是坐那辆车来的。", "门上的字留了三天，没有人来刷。主日那天，空了几排座位。"], ["总部派来一位“属灵督导”，住进了费尔蒙酒店，账单寄到堂里。", "他翻了翻流水，满意地走了，临行祝福你“前程远大”。", "他查了三天账，带走了一份报告和两千元“差旅奉献”。"], ["你的讲道集锦在短视频平台上被人配了鼓点。", "标题是《史上最强连击牧师》。主日门口排起了没带圣经、只带手机的队伍。", "播放量：四十七。其中三十次是司琴的妈妈。"], ["长执会开会，议题只有一项：礼拜堂的陈设。", "吴长老说：“摩西造会幕，百姓奉献多到要拦阻。我们这里，是粮食站少到要拦阻。”", "长老们说，堂里布置得像个家，不像个衙门，也不像个银行。这就好。"], ["一辆旅游大巴停在了斯托克顿街。", "导游举着小旗：“这是旧金山最气派的中式教堂！”游客在奉献箱里留下了三万元“门票”。", "游客们下车拍了拍对面的包子铺，又上车走了。"], ["一位老华侨临终前，托人把祖传的一方端砚送到堂里。", "附信只有一行字：“我在这里听了四十年道。砚台留给会写字的人。”", ""], ["中文学校想借用副堂，周六教孩子们写毛笔字。", "第一堂课，孩子们写的是“爱”字。歪歪扭扭，贴满了走廊。", ""]], "STAFF": [["郑能量", "街头布道员", "逢人便说“正能量”。发单张时附赠一句“厉害了”，不要都不行。", "“牧师，今天发了八百张单张！其中七百张是我自己的自拍。”", "“负能量的人不要来，来了也不给椅子。”"], ["陈赢麻", "直播布道员", "每场直播的结尾必喊“赢麻了”，不管当天讲的是《约伯记》还是《耶利米哀歌》。", "“家人们，今晚在线三千人，双击屏幕领受祝福，赢麻了！”", "“约伯最后加倍得回来了——这叫什么？这叫赢麻了。”"], ["褚遥遥", "短视频布道总监", "口头禅“遥遥领先”。坚称挪亚方舟的设计领先同时代两千年，并做了三十期视频论证。", "“我们的受洗人数，对西克那边是遥遥领先，是断代式领先。”", "“牧师，我把您的讲章剪成了九秒一条。九秒，遥遥领先。”"], ["王战狼", "首席布道家", "讲道像开新闻发布会，每一段都以“奉劝某些人”开头，以“勿谓言之不预”结尾。一场能带进来两百人，也能吓跑二十个。", "“奉劝对岸某些牧师，不要搬起石头砸自己的脚。”", "“今天决志的有两百一十四位。我对此表示赞赏。”"], ["刘铁柱", "乡音布道王", "一口化不开的乡音，开着拖拉机改装的宣传车满湾区转，大喇叭循环播放“信耶稣，得永生；祖国好，家乡美”。没人听得全懂，可人就是一车一车地来。", "“牧师，俺今儿个拉来三百口子！拖拉机都压趴窝了！”", "“啥叫布道？就是吆喝。俺在村口吆喝了二十年化肥，这个俺熟。”"], ["赵爱国", "粮食站干事", "发米之前先领大家唱一首歌。泡面只肯发国产的那个牌子，说别的“吃了没有骨气”。", "“今天发了一百二十袋米。唱歌环节加了一首，大家都哭了——也可能是饿的。”", "“牧师，洋快餐的优惠券我替你撕了。”"], ["钱红旗", "长者探访干事", "探访必带保温杯和枸杞，劝每一位老人“多喝热水，少看外媒”。老人们居然都很吃这一套。", "“陈伯的血压降了。我说是热水的功劳，他说是不看新闻的功劳。”", "“牧师，保温杯我给您也备了一个，红色的。”"], ["孙复兴", "青年事工主任", "把青年团契改名叫“复兴号”，查经用思维导图，灵修有 KPI，迟到要写三百字检讨。年轻人怨声载道，出席率却翻了倍。", "“本季度团契的各项指标全面超额完成，形势一片大好。”", "“阿杰的检讨写得不深刻，我让他重写了。”"], ["李强国", "社区事工总干事", "人称“基建狂魔”。三天搭起一座粮食站，一周修好了全华埠的漏水屋顶，逢人就讲“这叫速度”。", "“隔壁街的屋顶我顺手也修了。那是间佛堂？没关系，这叫格局。”", "“牧师，给我两周，我在华埠盖一座立交桥。不需要？先盖了再说。”"], ["张翠花", "大锅饭事工总管", "一身大花袄，在停车场支起八口大锅，一顿饭喂饱半个华埠。谁说不合口味，她就问：“你是不是在外头把胃吃洋了？”", "“牧师，酸菜炖粉条管够！吃饱了不想家，吃饱了才信得进去！”", "“那个西克要是敢来，俺也给他盛一碗。吃完了再跟他掰扯。”"], ["冯入关", "法务助理", "每一份文件都要引一句《孙子兵法》。把国税局称作“关内”，把填报税表称作“入关”。", "“牧师，1099 表我填好了。知己知彼，百战不殆。”", "“关内来信了。兵来将挡，水来土掩，我先去泡个面。”"], ["卫反制", "合规律师", "收到任何公函，第一反应都是起草一份“对等反制清单”。银行只是来问个地址，她回了十一页。", "“银行问我们要流水，我反过来问他们要了他们的。对等。”", "“清单我拟好了，共三十七项。第一项：不给他们续咖啡。”"], ["沈双标", "税务律师", "开口必说“贵方这是典型的双重标准”。奇怪的是，对方每次都真的被问住了。", "“他们查我们，为什么不查德州？双标。我已经写进答辩状第一段。”", "“国税局的人说我胡搅蛮缠。我说：你们说别人就行，说我就不行？双标。”"], ["严正声", "首席大律师", "开口“严正交涉”，闭口“强烈不满”。对方通常在收到第三封抗议信后撤案——不是因为理亏，是因为实在读不下去了。", "“我已就此事向国税局提出严正交涉，并保留进一步反应的权利。”", "“对方表示遗憾。我方对此表示：早该如此。”"], ["牛二蛋", "土法大状", "没念过一天法学院。凭一句“你这不合理嘛”，外加一袋自家种的花生，让三任审计员主动结了案。他管这叫“以理服人，以花生服人”。", "“牧师放心，那几个查账的俺都处成哥们儿了，过年还说要来家吃饺子。”", "“法条俺不懂。俺就问他：你娘知道你这么欺负教会不？他就不吱声了。”"], ["王富贵", "巷口望风人", "搬一张小板凳坐在巷口喝茶，专认催收员的行头。会众管放贷公司派来的催收员叫“犹大的差役”——为几块银钱就肯卖邻舍的人。他认出一个，就朝巷子里咳嗽三声。", "“牧师，穿尖头皮鞋、夹公文包、进巷子先看门牌的，十个里有九个是。”", "“俺不抓人，俺就咳嗽。咳嗽不犯法。”"], ["赵招娣", "喊街的", "嗓门是全华埠最大的。差役一进巷子，她就站在楼梯口喊一嗓子，整条街的窗户全开了，那人前后都是街坊，走也走不脱，只好站住对账。", "“‘犹大的差役来啦——’牧师，我就喊这一句，剩下的事街坊自己会办。”", "“他们不怕告状，就怕我喊。我一喊，他连公文包都拿不稳。”"], ["孙铁蛋", "蹲守人", "背着铺盖卷，在被催债的人家楼下一蹲三天三夜，头上勒一条红布带，专等差役上门。来一个，堵一个，客客气气请到堂里喝茶对账。", "“牧师，铺盖俺自己带了。他啥时候来，俺啥时候请他喝茶。”", "“熬人这件事，俺在老家守瓜地的时候就练出来了。偷瓜的和催债的，脚步声一个样。”"], ["龚农兵", "捉拿队长", "带队捉拿犹大的差役。人堵住了，不打不骂，只请他坐下，当众念一节经文，再请他像税吏撒该那样交出钱囊：多收了谁的，还他四倍。公司为了把人领回去，交一大笔安抚费；平日里为了面子，按期送慰问金。会众越多，他出手越准。", "“‘我若讹诈了谁，就还他四倍。’——这是撒该说的。这位差役兄弟，钱囊请交出来。”", "“犹大为三十块银钱卖了人。你一个月卖几家，自己数数。”"], ["马大锤", "千人总指挥", "从前在工地上喊号子，一声“起——”能让三百人同时抬钢梁。如今他一声“围——”，一千位会众把巷子两头一堵，差役自己就把公文包举过了头顶。", "“牧师，今天一声号子，拿住三个。三家公司排着队来领人，信封一个比一个厚。”", "“喊号子的规矩：声音要齐，步子要齐，对账的时候算盘也要齐。”"]], "BYE": ["“此处不留爷，自有留爷处！”", "“总部的面子不够，我的格局你们给不起。”", "“我回去发展了，那边遥遥领先。”", "“勿谓言之不预。”"]});

CLAIMS:[
["God himself drew the borders between peoples. His plan was for each to keep apart and live its own life.","Paul speaks of borders so that men might seek God, not so that they might build walls. If all come from one blood, nobody is more “original” than anybody else."],
["Some races have carried a curse since the days of Noah. The Bible says so plainly.","Those words were spoken by Noah, waking from his wine, to Canaan. The text says nothing whatever about skin. What chapter one does say is that every human being is made in the image of God."],
["Each race should worship separately. Mixing them in one service is confusion, not unity.","John saw people of every nation, tribe, people and tongue standing before one throne. Pastor Sick cannot rewrite the seating plan of heaven."],
["A Chinese man in an American pulpit is a spiritual invasion.","The church at Antioch, the first to send out missionaries, had in its pulpit Simeon called Niger and Lucius of Cyrene. A multi-ethnic pulpit is not an invasion. It is the original pattern."],
["Marriage across races is against God’s will and defiles a holy line.","Miriam slandered Moses for marrying a Cushite woman. The one who was disciplined was Miriam."],
["Mercy goes to our own first. Outsiders wait at the back.","Jesus chose an outsider, a Samaritan, as the very model of a neighbour. And the Law says the stranger is to be treated as one born among you."],
["This land was promised by God to our people in particular.","Our citizenship is in heaven. On earth everyone is a sojourner and a pilgrim: those who came first and those who came later."],
["The gospel is the fruit of Western civilisation. Without the West there is no Christianity.","When the Ethiopian eunuch was baptised there was not one church in Europe. The gospel left Jerusalem, went south into Africa, and by the year 635 had reached Chang’an in the east."],
["Treating members differently by their background is pastoral wisdom.","To have respect of persons is sin. It was in the house of Cornelius that Peter finally understood: God shows no partiality."],
["Justice is a secular agenda. The pulpit should speak of saving souls and leave the rest alone.","Let judgment run down as waters. Do justly, love mercy, walk humbly with God: the prophets never sold these separately."],
["Jesus looked like us Westerners. That is no accident.","He was born in Bethlehem, fled to Egypt and grew up in Nazareth: a Middle Eastern carpenter. Scripture records nothing of his complexion. The painters chose that for him later."],
["Souls of different races weigh differently before God.","God so loved the world. That verse has no footnote, no schedule attached, and no exchange rate."],
["The wave of immigrants is God’s judgment on this country.","Ruth was a Moabite, a foreign widow fleeing famine. She became the great-grandmother of David and her name is written in the genealogy of Jesus. God calls that grace, not judgment."],
["Church leaders must come from the founding bloodline.","The qualifications for an overseer: blameless, sober, apt to teach, not greedy of money. Read down the whole list and bloodline is not on it. The one about money is worth reading twice, and that includes me."],
["Their languages are not fit for worship.","Parthians, Medes, Egyptians, Arabians: each heard the disciples tell the mighty works of God in his own mother tongue. The first thing the Spirit did was to stop minding accents."],
["Slavery in history was an order that God permitted.","“I have surely seen the affliction of my people.” The God of Exodus stands with the slaves. And Paul tells Philemon to receive Onesimus no longer as a servant but as a brother beloved."],
["Our culture simply is Christianity.","The council at Jerusalem settled this long ago: Gentiles who believe need not first become Jews. So nobody who believes today needs first to become anyone else."],
["Today God’s chosen people is our own nation.","If you are Christ’s, you are Abraham’s seed. That runs by promise, not by residence papers, and certainly not by a report from a genealogy website."],
["The strong ruling the weak is the law of creation.","The rulers of the Gentiles lord it over them, but it shall not be so among you. Whoever would be first must be servant of all. That is the law the Lord himself laid down."],
["Eating at one table with other races corrupts the faith.","Peter, out of fear, withdrew from the Gentiles’ table. Paul opposed him to his face, because it was not according to the truth of the gospel. Separate tables were ruled on in the apostles’ own day."],
["These foreign pastors cannot understand “our” Bible.","The Bible was written in Hebrew, Aramaic and Greek. For every person in this room, Pastor Sick included, it is a translation. Nobody is its landlord."],
["Poor peoples are poor because they are not blessed.","Has not God chosen the poor of this world to be rich in faith? The first “blessed” out of Jesus’s mouth went to the poor."],
["“Love your neighbour” means love your own countrymen. Nobody else counts.","If you love only those who love you, what reward have you? Loving only your own is what Jesus calls below the pass mark."],
["The Bible commands: have no dealings with foreigners.","He is our peace, who has broken down the middle wall of partition. Christ pulled that wall down. Pastor Sick wants to rebuild it, and wants us to pay for the bricks."],
["A country has peace only when it has one kind of people.","“Mine house shall be called an house of prayer for all people.” Those were the words on Jesus’s lips when he cleansed the temple and overturned the tables."],
["We hate no one. We only say that everyone should keep to his place.","Whoever says he loves God and hates his brother is a liar. If “keeping to his place” means asking a brother to sit outside the door, it is hatred with a necktie on."],
["The early church was pure and uniform, without all these colours.","The Greek-speaking widows were being neglected at the daily distribution. The apostles did not tell them to start their own church. They chose seven deacons, and all seven have Greek names."],
["Some cities and some peoples simply do not deserve mercy.","Jonah thought so too, and sat outside the city, furious, waiting for Nineveh to burn. God asked him: should I not spare this great city of more than a hundred and twenty thousand souls?"],
["The great revival of the last days belongs to one nation only.","“Teach all nations.” “This gospel shall be preached in all the world for a witness unto all nations.” The Lord said “all nations” more than once, precisely because some would pretend not to hear."],
["A pulpit with an accent has no authority.","Moses said he was slow of speech. God answered: who made man’s mouth? And Paul said he came not with excellency of speech. Authority does not live in how you roll your r’s."]
],

["Acts 17:26","And hath made of one blood all nations of men for to dwell on all the face of the earth"],
["Genesis 1:27","So God created man in his own image, in the image of God created he him; male and female created he them"],

ZW:[
"He uses the gospel as a wall. The gospel was born a door.",
"The cross is two beams, one across and one upright. He keeps only the upright, to stand taller on.",
"At Pentecost the Spirit made men speak the tongues of every nation. It did not check passports.",
"He says he is defending Christianity. Christ never needed bodyguards. He asked for disciples.",
"There are no private boxes at the banquet of heaven.",
"He counts bloodlines. God counts hairs, and the ones on his head have been counted too.",
"Some people read their own skin into the Bible, read it back out again, and call it revelation.",
"Babel scattered people. Pentecost gathered them. He is standing on the wrong hill.",
"He is afraid the face in the pulpit has changed. The face that should be seen in a pulpit was never the pastor’s.",
"His god is too small: small enough to fit inside one family tree.",
"The book of life records names. It has no column for race.",
"He wants a pure church. But the church was born a hospital, not a showroom.",
"When the Lord washed the disciples’ feet he did not first ask where they came from.",
"He guards the door and picks the guests, forgetting that he was invited too.",
"Baptismal water does not recognise skin, and communion bread does not ask where you were born.",
"He draws “us” so small that even Jesus has to queue outside.",
"The good shepherd leaves the ninety-nine to find the one. He leaves the one and issues membership cards to the ninety-nine.",
"Pride turned an angel into a devil. Lifting one nation to heaven will not end much better.",
"If blood could save, why would Jesus have had to shed his own?",
"If the gospel belonged to one kind of people it would have died out in some village long ago.",
"He stands on his ancestors’ shoulders and finds everyone else short. Under the cross, everybody kneels.",
"There is no fear in love. In his sermons there is nothing but fear.",
"He has built the church’s threshold very high. Jesus came in stooping, to wash feet.",
"When Paul says “we” he means Jew and Gentile. When he says “we” he means himself and the mirror.",
"In the choir of heaven no part is a solo.",
"He thinks he is guarding the vineyard. When the owner returns, he will ask why the workers were driven off.",
"Some worry that the church has changed colour. The only colour the church should have is the washed kind.",
"God made man from dust. From which country’s dust, he did not say, because it does not matter.",
"He has preached “our tradition” all his life. The oldest tradition of all is: all nations.",
"Hatred is a labour-saving theology. No Bible reading required, only a mirror.",
"He wants to separate the wheat from the tares. The Lord said that was not his job.",
"In Christ there is no pronoun “they”.",
"He fears someone will take his seat. In the kingdom the Lord sets the seats, and he likes to bring the last to the front.",
"Man looks on the outward appearance, the Lord on the heart. He looks at only one outward appearance.",
"The more alike the people under his pulpit become, the narrower the words from it get.",
"We do not have to prove we deserve to stand here. Whether anyone deserves it is for grace to say."
],

R_G:["You open the Bible and go through it line by line. The hall is silent, then someone calls “Amen”, and then the whole room is on its feet.","You finish the verse and add no comment. None is needed. The applause rolls from the back rows to the front.","An elderly sister pulls herself up by the pew in front and says “Amen” in a shaking voice. The whole hall rises with her.","You do not hurry. Each verse lands like a nail going into wood.","Halfway through, someone at the back shouts in English, someone at the front answers in Cantonese, and the room breaks into laughter and applause.","You close the Bible. Several hundred people stand, and the applause does not stop.","Tomorrow this will be cut into a short video. Right now it is simply a room full of people hearing the truth.","The choir director forgets his hand is still in the air and stands there nodding as hard as he can."],
R_E:["A perfectly balanced sermon. Some people in the pews are looking at their phones.","An elder in the front row takes off his glasses and wipes them for a long time.","After the service a sister asks you: “Pastor, the things he says: how are we supposed to answer?”","The sanctuary is quiet. It is the quiet of disappointment.","In the youth fellowship’s row, someone has folded the bulletin into a paper plane.","The pianist waits a long while, unsure whether to play the next hymn."],
R_A:["The whole room roars, stands and stamps, and the clip is trending by evening. But what you hit him with was not scripture. It was the same fire he uses.","Thunderous applause, whistles everywhere. An old deacon at the back does not clap. He slowly closes his Bible.","The young people are doubled up laughing, phones in the air. A mother covers her child’s ears.","It felt good, it truly did. Only, the Bible lying open on the lectern: you did not glance at this passage once.","The hall is on its feet cheering. It occurs to you that Sick’s congregation probably cheers him the same way.","The laughter sets the lanterns swinging. In the corner the treasurer mutters: “If this goes out, the lawyers will be calling.”"],
R_M:["The room gasps. Is that not the very verse Sick quoted last week? You have delivered his ammunition to his door.","Elder Wu’s head snaps up. The verse is real. But quoting it out of context is exactly Sick’s speciality.","Someone in the youth fellowship whispers: “Pastor, isn’t that... the other side’s argument?”","You finish reading. The whole hall is silent. Jay looks up the context on his phone and his face changes.","Sick’s people have recorded this passage and already have a title for it: “Even the Pastor at Golden Gate Admits”."],
R_X:["A fine verse, but beside the point. Some nod politely. More are leafing through the bulletin.","You read it with perfect diction. Sick’s words still hang in the air of the sanctuary, untouched.","A sister whispers to her neighbour: “What has that got to do with the question?”","The hall is quiet for three seconds. The pianist thinks you have finished and plays a chord.","That verse belongs on a bookmark, not in today’s sermon."],
O0:["The offering bags pass quietly along every row.","Nobody is pressed. Coins drop into the cloth bags with a small sound.","A little girl on tiptoe puts in a dollar she has held so long it is warm."],
O1:["Some wipe their eyes. Some look at their watches.","You speak of the leaking roof and the air-conditioning bill. Some nod, some sigh.","Ten minutes becomes eighteen. The bags go round twice."],

["An accounting student in the youth fellowship raises her hand: “Pastor, when will the financial report be published?”","You say: “We will discuss it at the next staff meeting.” She posts the sentence in the group chat.","You put the statements up on the screen. Someone in the pews applauds."],
["Word is that Sick’s congregation also wires money every week, to a certain “heritage fund” in Arkansas.","It strikes you that the two wire routes, drawn on a map, have rather similar shapes.",""],
["A young white brother who has left Sick’s church sits down in the last row.","He listens to ten minutes of your insults, gets up and leaves: “This place sounds the same as that one.”","After the service he stays to help stack chairs. Next week he brings two friends."],
["The bank’s compliance department phones for a “routine enquiry” into the purpose of your recent large interstate transfers.","They ask in great detail. You realise headquarters has never given you a single receipt.","You explain truthfully and attach the published accounts. They thank you and hang up."],
["The lanterns are lit on Grant Avenue, and the Mid-Autumn joint service is packed.","Choirs sing in turn in Cantonese, Mandarin, English and Spanish.",""],
["In the night someone spray-paints the sanctuary door. The security camera shows a car from Sick’s church.","First thing next morning the neighbours turn up to repaint. There are not enough brushes, and two teenagers silently take a pair. They came in that car.","The words stay on the door for three days. Nobody comes to paint over them. On Sunday several rows are empty."],
["Headquarters sends a “spiritual supervisor”, who checks into the Fairmont and has the bill sent to the church.","He leafs through the transfers, leaves satisfied, and blesses you with “a great future”.","He audits for three days and leaves with a report and two thousand dollars as a “travel offering”."],
["Someone has set a highlight reel of your sermons to a drum beat on a short-video app.","The title is “The Greatest Combo Pastor of All Time”. On Sunday there is a queue at the door of people carrying phones and no Bibles.","Views: forty-seven. Thirty of them are the pianist’s mother."],
["The board of elders meets with one item on the agenda: the furnishings of the sanctuary.","Elder Wu says: “When Moses built the tabernacle the people gave so much they had to be restrained. Here it is the pantry that has so little it must be restrained.”","The elders say the hall now feels like a home, not a government office and not a bank. That is as it should be."],
["A tour bus pulls up on Stockton Street.","The guide waves a little flag: “The most magnificent Chinese-style church in San Francisco!” The tourists leave thirty thousand dollars in “admission” in the offering box.","The tourists get off, photograph the bun shop across the road, and get back on."],
["An old overseas Chinese, on his deathbed, has his family’s Duan inkstone sent to the church.","The note has one line: “I listened to sermons here for forty years. Leave the inkstone to someone who can write.”",""],
["The Chinese school asks to borrow the side hall to teach children calligraphy on Saturdays.","In the first lesson the children write the character for “love”. Crooked and wobbly, the sheets cover the corridor wall.",""]
],
STAFF:[
["Zheng Nengliang","“Positive Energy” Zheng, street evangelist","Tells everyone he meets about “positive energy”. Every tract he hands out comes with a free “How awesome is that!”, whether you want it or not.","“Pastor, I handed out eight hundred tracts today! Seven hundred of them had my selfie on.”","“Negative people need not come. If they come, no chair.”"],
["Chen Yingma","“Winning So Hard” Chen, livestream evangelist","Ends every livestream by shouting “We are winning so hard!”, whether the day’s text was Job or Lamentations.","“Family, three thousand online tonight. Double-tap the screen to receive your blessing. We are winning so hard!”","“Job got back double in the end. What do you call that? Winning so hard.”"],
["Chu Yaoyao","“Far Ahead” Chu, director of short-video evangelism","Her catchphrase is “far, far ahead”. She maintains that the design of Noah’s ark was two thousand years ahead of its time, and has made thirty videos to prove it.","“Our baptism numbers are far, far ahead of Sick’s. A whole generation ahead.”","“Pastor, I have cut your sermon into nine-second clips. Nine seconds: far ahead.”"],
["Wang Zhanlang","“Wolf Warrior” Wang, chief evangelist","Preaches like a foreign-ministry press conference. Every paragraph opens with “We advise certain persons” and closes with “Do not say you were not warned.” One service brings in two hundred and frightens off twenty.","“We advise certain pastors across the bay not to lift a rock only to drop it on their own feet.”","“Two hundred and fourteen made a decision today. I express my appreciation.”"],
["Liu Tiezhu","“Iron Pillar” Liu, king of the village-accent sermon","Speaks in an accent you could cut with a knife and tours the Bay in a converted tractor, loudspeaker on a loop: “Believe in Jesus and live for ever; the motherland is good, the old village is fair.” Nobody catches all of it, yet they arrive by the truckload.","“Pastor, I hauled in three hundred today! The tractor’s gone flat on its belly!”","“What’s evangelism? Hollerin’. I hollered fertiliser at the village gate for twenty years. This I know.”"],
["Zhao Aiguo","“Love-the-Country” Zhao, food-pantry worker","Leads everyone in a song before the rice is given out. Will hand out only one home-grown brand of instant noodles; any other, she says, “leaves you with no backbone”.","“A hundred and twenty bags of rice today. I added a song, and everyone cried. Could have been hunger.”","“Pastor, I tore up your fast-food coupons for you.”"],
["Qian Hongqi","“Red Flag” Qian, elder-visitation worker","Never visits without a thermos and goji berries, and urges every old person to “drink more hot water and watch less foreign news”. The old people love it.","“Uncle Chan’s blood pressure is down. I say it was the hot water. He says it was not watching the news.”","“Pastor, I have a thermos for you too. A red one.”"],
["Sun Fuxing","“National Revival” Sun, director of youth ministry","Has renamed the youth fellowship “the Revival Express”. Bible study uses mind maps, devotions have KPIs, and latecomers write a three-hundred-word self-criticism. The young people grumble, and attendance has doubled.","“This quarter every indicator of the fellowship has been over-fulfilled. The situation is excellent.”","“Jay’s self-criticism was not deep enough. I have asked him to rewrite it.”"],
["Li Qiangguo","“Strong Nation” Li, general secretary for community ministry","Known as “the infrastructure maniac”. Put up a food pantry in three days and fixed every leaking roof in Chinatown in a week. Tells everyone: “That is what you call speed.”","“I did the roof on the next street while I was at it. A Buddhist hall? No matter. That is what you call breadth of vision.”","“Pastor, give me two weeks and I will build a flyover in Chinatown. Not needed? Build first, discuss later.”"],
["Zhang Cuihua","“Emerald Flower” Zhang, head of the big-pot ministry","In a padded jacket of big bright flowers, she sets up eight cauldrons in the car park and feeds half of Chinatown at one sitting. Anyone who says it is not to their taste is asked: “Has eating abroad turned your stomach foreign?”","“Pastor, pickled cabbage and glass noodles, all you can eat! Full bellies don’t get homesick, and a full belly is what lets the word go in!”","“If that Sick dares to come, I’ll ladle him a bowl too. He can argue after he’s eaten.”"],
["Feng Ruguan","“Through-the-Pass” Feng, legal assistant","Quotes The Art of War in every document. Calls the IRS “inside the Pass” and filing a tax return “entering the Pass”.","“Pastor, the 1099 is done. Know yourself, know your enemy: a hundred battles, a hundred victories.”","“A letter from inside the Pass. Soldiers are met with generals, water with earth. First, I’ll make some instant noodles.”"],
["Wei Fanzhi","“Countermeasures” Wei, compliance lawyer","Her first response to any official letter is to draft a “list of reciprocal countermeasures”. The bank only asked for an address. She replied in eleven pages.","“The bank asked for our statements, so I asked for theirs. Reciprocity.”","“The list is drafted. Thirty-seven items. Item one: no more coffee refills for them.”"],
["Shen Shuangbiao","“Double Standards” Shen, tax lawyer","Every sentence begins: “This is a textbook case of double standards.” The odd thing is that the other side is stumped every time.","“They audit us. Why not Texas? Double standards. It is in the first paragraph of my reply.”","“The IRS man said I was being unreasonable. I said: you may say it of others but I may not say it of you? Double standards.”"],
["Yan Zhengsheng","“Solemn Statement” Yan, senior counsel","Opens with “solemn representations” and closes with “strong dissatisfaction”. The other side generally drops the case after the third letter of protest. Not because they are in the wrong. They simply cannot read any more.","“I have lodged solemn representations with the IRS and reserve the right to respond further.”","“The other side has expressed regret. Our side’s response: about time.”"],
["Niu Erdan","“Second Egg” Niu, country-style advocate","Never spent a day in law school. With the single line “Now that just isn’t fair, is it?” and a sack of home-grown peanuts, he has had three successive auditors close their own cases. He calls it “winning them over by reason, and by peanuts”.","“Don’t worry, Pastor. Those audit fellas are my pals now. They say they’re coming round for dumplings at New Year.”","“I don’t know statutes. I just ask him: does your mother know you pick on churches like this? Then he goes quiet.”"],
["Wang Fugui","“Rich-and-Noble” Wang, lookout at the alley mouth","Sits on a little stool at the mouth of the alley drinking tea, and knows a debt collector by his outfit. The flock call the collectors sent by the loan companies “the officers of Judas”: men who will sell a neighbour for a few pieces of silver. When he spots one he coughs three times down the alley.","“Pastor, pointed shoes, a document case, and checking the door numbers on the way in: nine out of ten, that is one of them.”","“I arrest nobody. I only cough. Coughing is not against the law.”"],
["Zhao Zhaodi","“Bring-a-Brother” Zhao, the street crier","Has the loudest voice in Chinatown. The moment an officer steps into the alley she shouts once from the stairwell, every window on the street opens, and the man finds neighbours in front and behind. He cannot leave, so he stands and goes through the accounts.","“‘The officers of Judas are here!’ That is all I shout, Pastor. The neighbours see to the rest.”","“They are not afraid of being sued. They are afraid of me shouting. One shout and he cannot keep hold of his document case.”"],
["Sun Tiedan","“Iron Egg” Sun, the stake-out man","Arrives with his bedroll on his back and squats for three days and nights below the home of whoever is being dunned, a red cloth band round his head, waiting for the officer to call. Each one who comes is blocked and politely invited to the church hall for tea and a look at the figures.","“Pastor, I brought my own bedding. Whenever he turns up, that is when I invite him to tea.”","“Outlasting people: I learned that back home, guarding the melon patch. Melon thieves and debt collectors have the same footstep.”"],
["Gong Nongbing","“Workers-Peasants-Soldiers” Gong, captain of the catchers","Leads the party that catches the officers of Judas. Once the man is hemmed in, nobody strikes or curses him. He is asked to sit, a verse is read aloud before everyone, and he is invited, like Zacchaeus the tax collector, to hand over the purse: whatever was overcharged, restored fourfold. To get its man back the company pays a large pacification fee; to save face it sends consolation money on schedule. The bigger the flock, the surer his aim.","“‘If I have taken any thing from any man, I restore him fourfold.’ Zacchaeus said that. Brother officer, the purse, please.”","“Judas sold a man for thirty pieces of silver. Count for yourself how many households you sell in a month.”"],
["Ma Dachui","“Big Hammer” Ma, commander of a thousand","Used to call the work chants on building sites: one shout of “Heave!” and three hundred men lifted a steel beam together. Now he shouts “Close in!”, a thousand of the flock seal both ends of the alley, and the officer raises his document case above his head of his own accord.","“Pastor, one chant today and we held three. Three companies queued up to collect their men, each envelope thicker than the last.”","“The rules of a work chant: voices together, steps together, and abacuses together when the accounts are checked.”"]
],
