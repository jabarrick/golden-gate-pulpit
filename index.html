CLAIMS:[
["Foi Deus quem traçou as fronteiras entre os povos. O plano dele era que cada um ficasse à parte, a viver a sua vida.","Paulo fala de fronteiras para que os homens procurem Deus, não para que levantem muros. Se todos vêm de um só, ninguém é mais “de origem” do que os outros."],
["Há raças que carregam uma maldição desde os dias de Noé. Está escrito na Bíblia.","Essas palavras disse-as Noé, ao acordar do vinho, a Canaã. O texto não diz uma única palavra sobre a cor da pele. O que o capítulo um diz é que todo o ser humano é feito à imagem de Deus."],
["Cada raça deve fazer o seu culto à parte. Misturá-las é confusão, não é unidade.","João viu gente de todas as nações, tribos, povos e línguas diante do mesmo trono. O pastor Sick não consegue mudar a disposição dos lugares no céu."],
["Um chinês num púlpito americano é uma invasão espiritual.","A igreja de Antioquia, a primeira a enviar missionários, tinha no púlpito Simeão, chamado Níger, e Lúcio de Cirene. Um púlpito com várias etnias não é invasão. É o modelo original."],
["O casamento entre raças é contra a vontade de Deus e mancha uma descendência santa.","Miriã difamou Moisés por ter casado com uma mulher cuxita. Quem foi castigada foi Miriã."],
["A misericórdia é primeiro para os nossos. Os de fora esperam lá atrás.","Jesus escolheu precisamente um de fora, um samaritano, como modelo do próximo. E a Lei manda tratar o estrangeiro como um natural da terra."],
["Esta terra foi prometida por Deus ao nosso povo, e só a ele.","A nossa cidadania está nos céus. Na terra todos somos peregrinos e forasteiros: os que chegaram primeiro e os que chegaram depois."],
["O evangelho é fruto da civilização ocidental. Sem o Ocidente não há cristianismo.","Quando o eunuco etíope foi batizado não havia uma única igreja na Europa. O evangelho saiu de Jerusalém, desceu para África e, no ano 635, já tinha chegado a Chang’an, no Oriente."],
["Tratar os membros de maneira diferente conforme a origem é sabedoria pastoral.","Fazer aceção de pessoas é pecado. Foi em casa de Cornélio que Pedro finalmente percebeu: Deus não faz distinção."],
["A justiça é uma agenda secular. O púlpito deve falar da salvação das almas e deixar o resto.","Corra o juízo como as águas. Praticar a justiça, amar a misericórdia, andar humildemente com Deus: os profetas nunca venderam estas coisas em separado."],
["Jesus tinha a nossa aparência de ocidentais. Não é por acaso.","Nasceu em Belém, fugiu para o Egito e cresceu em Nazaré: um carpinteiro do Médio Oriente. A Escritura não regista nada sobre a sua tez. Isso escolheram-no os pintores, mais tarde."],
["As almas de raças diferentes não pesam o mesmo diante de Deus.","Deus amou o mundo. Este versículo não tem nota de rodapé, nem tabela anexa, nem taxa de câmbio."],
["A vaga de imigrantes é o juízo de Deus sobre este país.","Rute era moabita, uma viúva estrangeira a fugir da fome. Veio a ser bisavó de David e o nome dela está na genealogia de Jesus. A isso Deus chama graça, não juízo."],
["Os líderes da igreja têm de vir do sangue dos fundadores.","As condições para ser bispo: irrepreensível, sóbrio, apto para ensinar, não cobiçoso de dinheiro. Leia-se a lista toda: o sangue não está lá. A do dinheiro vale a pena ler duas vezes, e isso inclui-me a mim."],
["As línguas deles não servem para o culto.","Partos, medos, egípcios, árabes: cada um ouviu os discípulos contar as grandezas de Deus na sua língua materna. A primeira coisa que o Espírito fez foi deixar de se importar com sotaques."],
["A escravatura, na história, foi uma ordem permitida por Deus.","“Tenho visto a aflição do meu povo.” O Deus do Êxodo está do lado dos escravos. E Paulo manda Filémon receber Onésimo já não como servo, mas como irmão amado."],
["A nossa cultura é o próprio cristianismo.","O concílio de Jerusalém já decidiu isto há muito: os gentios que creem não precisam de se tornar judeus primeiro. Logo, quem crê hoje não precisa de se tornar noutra pessoa qualquer."],
["Hoje o povo eleito de Deus é a nossa nação.","Se sois de Cristo, sois descendência de Abraão. É pela promessa, não pelo registo de residência, e muito menos pelo relatório de um site de genealogia."],
["Os fortes governarem os fracos é a lei da criação.","Os governantes das nações dominam-nas, mas entre vós não será assim. Quem quiser ser o primeiro seja servo de todos. Esta é a lei que o próprio Senhor deixou."],
["Comer à mesma mesa com outras raças corrompe a fé.","Pedro, por medo, afastou-se da mesa dos gentios. Paulo resistiu-lhe na cara, porque aquilo não era conforme a verdade do evangelho. As mesas separadas foram julgadas ainda no tempo dos apóstolos."],
["Estes pastores estrangeiros não conseguem entender a “nossa” Bíblia.","A Bíblia foi escrita em hebraico, aramaico e grego. Para toda a gente nesta sala, o pastor Sick incluído, é uma tradução. Ninguém é senhorio dela."],
["Os povos pobres são pobres porque não são abençoados.","Não escolheu Deus os pobres deste mundo para serem ricos na fé? O primeiro “bem-aventurados” que saiu da boca de Jesus foi para os pobres."],
["“Amar o próximo” quer dizer amar os compatriotas. Os outros não contam.","Se amardes só os que vos amam, que recompensa tereis? Amar só os seus é aquilo a que Jesus chama ficar abaixo da nota mínima."],
["A Bíblia ordena: não ter trato com estrangeiros.","Ele é a nossa paz, e derrubou a parede de separação. Cristo deitou esse muro abaixo. O pastor Sick quer voltar a levantá-lo, e quer que sejamos nós a pagar os tijolos."],
["Um país só tem paz quando tem um único tipo de gente.","“A minha casa será chamada casa de oração para todos os povos.” Eram estas as palavras na boca de Jesus quando purificou o templo e virou as mesas."],
["Não odiamos ninguém. Só dizemos que cada um deve ficar no seu lugar.","Quem diz que ama a Deus e odeia o irmão é mentiroso. Se “ficar no seu lugar” quer dizer pedir a um irmão que se sente lá fora, é ódio de gravata."],
["A igreja primitiva era pura e uniforme, sem estas misturas.","As viúvas de língua grega estavam a ser esquecidas na distribuição diária. Os apóstolos não as mandaram fundar outra igreja. Escolheram sete diáconos, e os sete têm nomes gregos."],
["Há cidades e povos que simplesmente não merecem misericórdia.","Jonas também pensava assim, e sentou-se fora da cidade, furioso, à espera de ver Nínive arder. Deus perguntou-lhe: não hei de ter compaixão desta grande cidade com mais de cento e vinte mil pessoas?"],
["O grande avivamento dos últimos dias pertence a uma só nação.","“Ensinai todas as nações.” “Este evangelho será pregado em todo o mundo, em testemunho a todas as nações.” O Senhor disse “todas as nações” mais de uma vez, precisamente porque alguns iam fingir que não ouviram."],
["Um púlpito com sotaque não tem autoridade.","Moisés disse que era pesado de língua. Deus respondeu: quem fez a boca do homem? E Paulo disse que não veio com sublimidade de palavras. A autoridade não mora na maneira de enrolar os erres."]
],

ATK:[

["Apelar ao boicote","“A partir de hoje ninguém compra nas lojas dos membros dele!”"],

["Gozar com o cabelo","“Um homem que seca o cabelo daquela maneira: o que é que esperam que ele faça a um versículo?”"],
["Amaldiçoar as audiências","“Declaro em nome do Senhor: a partir de hoje a transmissão dele tem um espectador, a mãe!”"],
["Insinuar um escândalo","“Sobre aquela secretária dele, hoje é melhor não dizer nada. Quem sabe, sabe.”"],
["Comparar cabeças","“Quantos se sentam na igreja dele? Quantos se sentam aqui? Contem, e vejam de que lado está Deus!”"],
["Comparar ofertas","“A oferta dele de um ano inteiro não paga um par das nossas colunas! Isto é bênção. O dele é falência!”"],
["Mandá-lo embora","“Gente como ele não tem lugar na Califórnia! Que volte para o buraco de onde veio!”"],

ZF:["Amemo-nos uns aos outros, amém.","Que Deus o ilumine.","São tempos complicados.","Vamos orar por ele.","Voltemos ao texto.","Cada um tem a sua opinião.","Havia uma cadeira sobre isto no seminário.","Hoje o tempo é pouco.","É um tema sensível.","Não julgamos ninguém.","Em suma, haja amor.","Deixo isto para pensarem depois.","Hum... onde é que eu ia?","Tudo tem dois lados."],

SHOUT:["Amém!","Bem dito!","É isso mesmo!","Prega!","¡Amén!","Aleluia!","Grande verdade!","Mais uma!","Força, pastor!","Sim!!","É esse o ponto!","Amém, pastor!","Tocou-me cá dentro!","Aponta isso!","Ponham no boletim!","Palmas!","Bravo!","Outra vez, pastor!","Graças a Deus!","Soube bem!","Amém, amém, amém!","Em cheio!","Gravei tudo!","Tudo verdade!","Convenceu-me!","Diga outra vez!","Irmãs, de pé!","Chá para o pastor!","Isto é que é sermão!","O meu marido vai ouvir isto!"],
R_G:["Abres a Bíblia e vais linha a linha. A sala fica em silêncio, depois alguém diz “Amém”, e depois está toda a gente de pé.","Acabas o versículo e não acrescentas comentário. Não é preciso. Os aplausos rolam das últimas filas até à frente.","Uma irmã idosa levanta-se agarrada ao banco da frente e diz “Amém” com a voz a tremer. A sala inteira levanta-se com ela.","Não tens pressa. Cada versículo cai como um prego a entrar na madeira.","A meio, alguém lá atrás grita em inglês, alguém à frente responde em cantonês, e a sala desata a rir e a aplaudir.","Fechas a Bíblia. Centenas de pessoas levantam-se e os aplausos não param.","Amanhã isto vai ser cortado para um vídeo curto. Agora é só uma sala cheia de gente a ouvir a verdade.","O maestro do coro esquece-se de que ainda tem a mão no ar e fica ali a acenar com a cabeça com toda a força."],
R_E:["Um sermão perfeitamente equilibrado. Há gente nos bancos a olhar para o telemóvel.","Um presbítero da primeira fila tira os óculos e limpa-os durante muito tempo.","Depois do culto, uma irmã pergunta-te: “Pastor, aquilo que ele diz: como é que havemos de responder?”","O santuário está calado. É o silêncio da desilusão.","Na fila dos jovens, alguém dobrou o boletim num avião de papel.","A pianista espera muito tempo, sem saber se há de tocar o hino seguinte."],
R_A:["A sala ruge, levanta-se e bate os pés, e à noite o excerto já anda nas tendências. Mas aquilo com que lhe bateste não foi a Escritura. Foi o mesmo fogo que ele usa.","Aplausos estrondosos, assobios por todo o lado. Um velho diácono lá atrás não aplaude. Fecha a Bíblia devagar.","Os jovens dobram-se a rir, telemóveis no ar. Uma mãe tapa os ouvidos do filho.","Soube bem, soube mesmo. Só que a Bíblia aberta no púlpito: para esta passagem não olhaste uma única vez.","A sala está de pé a aclamar. Ocorre-te que os fiéis de Sick devem aclamá-lo da mesma maneira.","As gargalhadas põem as lanternas a baloiçar. Ao canto, a tesoureira resmunga: “Se isto sai daqui, os advogados vão ligar.”"],
R_M:["A sala fica em sobressalto. Não é esse o versículo que Sick citou na semana passada? Foste levar-lhe as munições à porta.","O presbítero Wu levanta a cabeça de repente. O versículo é verdadeiro. Mas citá-lo fora do contexto é precisamente a especialidade de Sick.","Alguém do grupo de jovens sussurra: “Pastor, isso não é... o argumento do outro lado?”","Acabas de ler. A sala inteira está em silêncio. O Jay procura o contexto no telemóvel e muda de cara.","A gente de Sick gravou esta passagem e já tem título: “Até o pastor da Golden Gate admite”."],
R_X:["Um belo versículo, mas não vem a propósito. Alguns acenam por delicadeza. A maioria folheia o boletim.","Leste com dicção perfeita. As palavras de Sick continuam suspensas no ar do santuário, intactas.","Uma irmã sussurra à vizinha: “O que é que isso tem a ver com a pergunta?”","A sala cala-se três segundos. A pianista pensa que acabaste e toca um acorde.","Este versículo fica bem num marcador de livros, não no sermão de hoje."],
O0:["Os sacos da oferta passam em silêncio por todas as filas.","Ninguém é apressado. As moedas caem nos sacos de pano com um som pequenino.","Uma menina em bicos de pés põe lá um dólar que segurou tanto tempo que está morno."],
O1:["Uns limpam os olhos. Outros olham para o relógio.","Falas do telhado que pinga e da conta do ar condicionado. Uns acenam, outros suspiram.","Dez minutos passam a dezoito. Os sacos dão duas voltas."],
O2:["Os nomes sobem pela tabela. Na última fila, um lavador de pratos tira do bolso a renda desta semana.","“Há algum irmão ou irmã que desafie o primeiro lugar?” Rebenta fogo de artifício no ecrã.","O código QR brilha vinte minutos inteiros. Um velho pergunta ao vizinho: “Duplica para quem?”"],
MEMOS:[
"A cúpula de vidro do novo templo da sede ainda tem quatro milhões em falta. O distrito da Golden Gate é o nosso “celeiro da Costa Oeste”.",
"Os irmãos de Fort Worth oram pelos vossos números de oferta todas as manhãs às cinco. Os números falam.",
"O jato ministerial do Supervisor-Geral precisa de um motor novo. As asas são os pés do evangelho.",
"Saiu a classificação das filiais da Costa Oeste deste trimestre. A Golden Gate está em sétimo. Sétimo não é número de vitória.",
"Atenção: as filiais com a rubrica “despesas locais” excessiva receberão aconselhamento espiritual e financeiro.",
"Está a ser instalado um teleférico no monte de oração do rancho da sede, para que os grandes doadores idosos cheguem ao cimo.",
"Aproxima-se o mês de Ação de Graças. No ano passado a filial de Houston enviou quatrocentos mil numa só semana. Que o número vos inspire.",
"O Supervisor-Geral visitará a Costa Oeste em pessoa. Recebam-no com um cheque gigante (pode ser adereço; o valor tem de ser real).",
"As contas do fim do ano estão à porta. A sede lembra: a fé não tem teto, e a quota também não.",
"Diz o Supervisor-Geral: “Servo bom e fiel é aquele cujos extratos se podem ver.”",
"Avariou o controlo de temperatura da piscina da sede, isto é, do “grande batistério”. Pede-se oração e pagamento urgentes.",
"Consta que a vossa filial adquiriu bastante decoração. A sede lembra: os enfeites são da terra, as remessas são do céu.",
"A linha de cosmética “Mulheres Piedosas” da senhora Zhou está quase a sair. A quota de compra de cada filial segue em carta à parte.",
"A sede decidiu erguer uma estátua de bronze do Supervisor-Geral “para inspirar os vindouros”. Compromisso da Golden Gate: o braço esquerdo.",
"Dallas já enviou esta semana. Austin já enviou. San Antonio já enviou. Só falta a Costa Oeste.",
"Nota dos advogados da sede: para fora, dizer sempre “oferta”, nunca “remessa”; dizer “visão”, nunca “orçamento”.",
"O Seminário Estrela Solitária tem falta de alunos. Indiquem dez candidatos. As propinas podem ser pagas pela vossa filial.",
"O novo livro do Supervisor-Geral, Asas da Fé, é distribuído à razão de quinhentos exemplares por filial. Incluam o pagamento na remessa desta semana.",
"O rancho recebeu doze puros-sangues para o “Campo de Equitação do Discipulado Jovem”. Os cavalos têm os nomes dos doze apóstolos.",
"Esta noite o Supervisor-Geral teve um sonho: um rio de ouro a correr de São Francisco para o Texas."
],

COLE_DN:["Na rádio, Sick fica dez segundos calado e depois põe hinos a tocar.","Esta semana o programa de Sick passou a “Cartas dos ouvintes”. Há uma carta. É da mulher dele.","Sick anuncia uma semana de “retiro espiritual”.","Diz-se que dois diáconos de Sick se demitiram. Um deixou um bilhete: “Fui a casa e li aquela passagem três vezes.”","Sick cita-te na rádio para te refutar, chega a meio e para.","A “Voz da Herança Pura” perdeu quarenta mil subscritores esta semana."],

STAFF:[
["Zheng Nengliang","Zheng “Energia Positiva”, evangelista de rua","Fala de “energia positiva” a toda a gente. Cada folheto vem com um “Que espetáculo!” de oferta, quer se queira quer não.","“Pastor, hoje distribuí oitocentos folhetos! Setecentos tinham a minha selfie.”","“Gente negativa escusa de vir. Se vier, não há cadeira.”"],
["Chen Yingma","Chen “A Ganhar em Grande”, evangelista em direto","Acaba todos os diretos a gritar “Estamos a ganhar em grande!”, seja o texto do dia Job ou as Lamentações.","“Família, três mil em linha esta noite. Toquem duas vezes no ecrã para receber a bênção. Estamos a ganhar em grande!”","“Job recebeu tudo a dobrar no fim. Como é que se chama a isso? Ganhar em grande.”"],
["Chu Yaoyao","Chu “Muito à Frente”, diretora de evangelismo em vídeo curto","O bordão dela é “muito, muito à frente”. Garante que o desenho da arca de Noé ia dois mil anos à frente do seu tempo, e fez trinta vídeos a prová-lo.","“Os nossos números de batismos vão muito, muito à frente dos do Sick. Uma geração inteira à frente.”","“Pastor, cortei o seu sermão em excertos de nove segundos. Nove segundos: muito à frente.”"],
["Wang Zhanlang","Wang “Lobo Guerreiro”, evangelista principal","Prega como numa conferência de imprensa do ministério dos estrangeiros. Cada parágrafo abre com “Aconselhamos certas pessoas” e fecha com “Depois não digam que não foram avisados.” Um culto traz duzentas pessoas e assusta vinte.","“Aconselhamos certos pastores do outro lado da baía a não levantarem uma pedra para a deixarem cair nos próprios pés.”","“Hoje decidiram-se duzentos e catorze. Manifesto o meu apreço.”"],
["Liu Tiezhu","Liu “Pilar de Ferro”, rei do sermão com sotaque da aldeia","Tem um sotaque que se corta à faca e anda pela baía num trator adaptado, com o altifalante em repetição: “Crê em Jesus e vive para sempre; a pátria é boa, a aldeia é linda.” Ninguém percebe tudo, e mesmo assim chegam às carradas.","“Pastor, hoje trouxe trezentos! O trator ficou de barriga no chão!”","“O que é evangelizar? É apregoar. Apregoei adubo à entrada da aldeia vinte anos. Disto percebo eu.”"],
["Zhao Aiguo","Zhao “Ama-a-Pátria”, obreira do banco alimentar","Põe toda a gente a cantar antes de dar o arroz. Só distribui uma marca nacional de massa instantânea; as outras, diz, “deixam uma pessoa sem espinha”.","“Hoje saíram cento e vinte sacos de arroz. Juntei mais uma canção e toda a gente chorou. Também pode ter sido fome.”","“Pastor, rasguei-lhe os cupões da comida rápida.”"],
["Qian Hongqi","Qian “Bandeira Vermelha”, obreiro de visitas a idosos","Nunca visita sem termo e bagas de goji, e aconselha cada idoso a “beber mais água quente e ver menos notícias estrangeiras”. Os idosos adoram.","“A tensão do tio Chan baixou. Eu digo que foi a água quente. Ele diz que foi não ver as notícias.”","“Pastor, também tenho um termo para si. Vermelho.”"],
["Sun Fuxing","Sun “Renascimento Nacional”, diretor do ministério de jovens","Rebatizou o grupo de jovens como “Expresso do Renascimento”. O estudo bíblico usa mapas mentais, a devoção tem indicadores, e quem chega atrasado escreve uma autocrítica de trezentas palavras. Os jovens resmungam, e a assiduidade duplicou.","“Neste trimestre todos os indicadores do grupo foram ultrapassados. A situação é excelente.”","“A autocrítica do Jay não foi suficientemente profunda. Mandei-o reescrevê-la.”"],
["Li Qiangguo","Li “Nação Forte”, secretário-geral do ministério comunitário","Conhecido como “o maníaco das obras”. Montou um banco alimentar em três dias e consertou todos os telhados de Chinatown numa semana. Diz a toda a gente: “A isto chama-se rapidez.”","“Já agora arranjei o telhado da rua ao lado. É um templo budista? Não faz mal. A isto chama-se largueza de vistas.”","“Pastor, dê-me duas semanas e faço um viaduto em Chinatown. Não é preciso? Primeiro constrói-se, depois logo se vê.”"],
["Zhang Cuihua","Zhang “Flor de Esmeralda”, chefe do ministério do panelão","De casaco acolchoado às flores garridas, monta oito caldeirões no parque de estacionamento e dá de comer a meia Chinatown de uma assentada. A quem diz que não é do seu gosto, pergunta: “Andar a comer lá fora pôs-te o estômago estrangeiro?”","“Pastor, couve fermentada com massa de feijão, à vontade! Barriga cheia não tem saudades, e é de barriga cheia que a palavra entra!”","“Se esse Sick se atrever a vir, também lhe sirvo uma tigela. Discute depois de comer.”"],
["Feng Ruguan","Feng “Pelo Desfiladeiro”, assistente jurídico","Cita A Arte da Guerra em todos os documentos. Chama ao fisco “dentro do Desfiladeiro” e a entregar a declaração de impostos “entrar no Desfiladeiro”.","“Pastor, o 1099 está preenchido. Conhece-te a ti e ao inimigo: cem batalhas, cem vitórias.”","“Chegou carta de dentro do Desfiladeiro. A soldados respondem generais, à água responde a terra. Primeiro vou fazer uma massa instantânea.”"],
["Wei Fanzhi","Wei “Contramedidas”, advogada de conformidade","A primeira reação a qualquer ofício é redigir uma “lista de contramedidas recíprocas”. O banco só pediu uma morada. Ela respondeu em onze páginas.","“O banco pediu os nossos extratos, e eu pedi os deles. Reciprocidade.”","“A lista está feita. Trinta e sete pontos. Ponto um: acabou-se o café de borla para eles.”"],
["Shen Shuangbiao","Shen “Dois Pesos”, advogado fiscal","Cada frase começa por: “Isto é um caso típico de dois pesos e duas medidas.” O estranho é que o outro lado fica sempre sem resposta.","“Fiscalizam-nos a nós. E o Texas? Dois pesos e duas medidas. Está no primeiro parágrafo da minha resposta.”","“O homem do fisco disse que eu estava a ser irrazoável. Respondi: vocês podem dizê-lo dos outros e eu não o posso dizer de vocês? Dois pesos.”"],
["Yan Zhengsheng","Yan “Declaração Solene”, advogado sénior","Abre com “diligências solenes” e fecha com “forte descontentamento”. O outro lado costuma desistir à terceira carta de protesto. Não por não ter razão. Simplesmente já não aguenta ler.","“Apresentei diligências solenes junto do fisco e reservo o direito de reagir de novo.”","“A outra parte lamentou. Resposta da nossa parte: já não era sem tempo.”"],
["Niu Erdan","Niu “Segundo Ovo”, causídico à moda da terra","Nunca pôs os pés numa faculdade de direito. Com a frase “Ó homem, isso não é justo, pois não?” e um saco de amendoins da horta, fez três auditores seguidos fecharem os próprios processos. Chama-lhe “convencer pela razão, e pelo amendoim”.","“Descanse, pastor. Os da auditoria já são meus compinchas. Dizem que vêm cá comer raviólis no Ano Novo.”","“De artigos não percebo. Só lhe pergunto: a tua mãe sabe que andas a implicar com igrejas? E ele cala-se.”"],
["Wang Fugui","Wang “Rico-e-Nobre”, vigia à entrada da viela","Senta-se num banquinho à entrada da viela a beber chá e reconhece um cobrador pela farpela. Os fiéis chamam aos cobradores mandados pelas empresas de crédito “os oficiais de Judas”: gente que vende um vizinho por umas moedas de prata. Quando avista um, tosse três vezes para dentro da viela.","“Pastor, sapato bicudo, pasta debaixo do braço e a ver os números das portas ao entrar: em dez, nove são deles.”","“Eu não prendo ninguém. Só tusso. Tossir não é crime.”"],
["Zhao Zhaodi","Zhao “Traz-um-Irmão”, pregoeira da rua","Tem a voz mais forte de Chinatown. Mal um oficial entra na viela, ela grita uma vez do vão da escada, abrem-se todas as janelas da rua e o homem fica com vizinhos à frente e atrás. Não pode sair, por isso fica e confere as contas.","“‘Chegaram os oficiais de Judas!’ É só isto que eu grito, pastor. Do resto tratam os vizinhos.”","“Eles não têm medo de processos. Têm medo de que eu grite. Um grito e ele já nem segura a pasta.”"],
["Sun Tiedan","Sun “Ovo de Ferro”, o homem da espera","Chega com a enxerga às costas e fica três dias e três noites de cócoras debaixo da casa de quem anda a ser cobrado, com uma fita vermelha na cabeça, à espera de que o oficial apareça. Cada um que vem é travado e convidado, com toda a delicadeza, a ir ao salão da igreja tomar chá e ver os números.","“Pastor, trouxe a minha roupa de cama. Quando ele aparecer, é nessa hora que o convido para o chá.”","“Cansar os outros: aprendi lá na terra, a guardar o meloal. Ladrão de melões e cobrador têm o mesmo passo.”"],
["Gong Nongbing","Gong “Operários-Camponeses-Soldados”, capitão da captura","Comanda o grupo que apanha os oficiais de Judas. Com o homem cercado, ninguém lhe bate nem o insulta. Pedem-lhe que se sente, lê-se um versículo diante de todos e convidam-no, como a Zaqueu, o publicano, a entregar a bolsa: o que cobrou a mais, restituído a quadruplicar. Para reaver o seu homem, a empresa paga uma grande taxa de apaziguamento; para salvar a face, manda subsídios de consolação a horas certas. Quanto mais fiéis, mais certeira a mão dele.","“‘Se nalguma coisa tenho defraudado alguém, o restituo quadruplicado.’ Foi Zaqueu que o disse. Irmão oficial, a bolsa, por favor.”","“Judas vendeu um homem por trinta moedas de prata. Conta tu quantas casas vendes por mês.”"],
["Ma Dachui","Ma “Marreta Grande”, comandante de mil","Dantes dava a cadência nas obras: um grito de “Força!” e trezentos homens levantavam a viga ao mesmo tempo. Agora grita “Cerquem!”, mil fiéis fecham as duas pontas da viela, e o oficial levanta a pasta acima da cabeça por iniciativa própria.","“Pastor, hoje foi uma cadência e apanhámos três. Três empresas fizeram fila para vir buscar os seus homens, cada envelope mais grosso do que o anterior.”","“As regras da cadência: vozes juntas, passos juntos, e os ábacos juntos na hora de conferir as contas.”"]

function initLang(){

 try{l=localStorage.getItem('jinmen_lang')||''}catch(e){l=''}
 if(!PACK[l]){const n=(navigator.language||'zh').toLowerCase();l=n.startsWith('pt')?'pt':n.startsWith('zh')?'zh':n.startsWith('en')?'en':'zh';}
 [...$('lang').querySelectorAll('button[data-l]')].forEach(b=>b.onclick=()=>setLang(b.dataset.l));
 $('bw').onclick=()=>openOv('wiki');$('bd').onclick=()=>openOv('debug');$('cam').onclick=takePhoto;
 $('ov').onclick=e=>{if(e.target===$('ov'))closeOv();};
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeOv();return;}
  if(OV||e.ctrlKey||e.metaKey||e.altKey)return;
  const a=document.activeElement,onBtn=a&&(a.tagName=='BUTTON'||a.tagName=='INPUT'||a.tagName=='TEXTAREA');
  if(/^[1-9]$/.test(e.key)){const ks=[...document.querySelectorAll('#card>button:not(.go)')];const b=ks[+e.key-1];if(b&&!b.disabled){e.preventDefault();b.click();}}
  else if(e.key==='Enter'&&!onBtn){const g=document.querySelector('#card button.go');if(g){e.preventDefault();g.click();}}
 });
 setLang(l);
}

function takePhoto(){
 scene();
 const W=1600,H=800,CAP=110,src=$('scene').innerHTML
  .replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-Hans" width="${W}" height="${H}" `)
  .replace('<defs>','<style>.h{opacity:0}text{font-family:"Noto Serif SC","Songti SC","Noto Serif CJK SC","SimSun",serif}</style><defs>');
 OV={kind:'photo',tab:0,url:'',err:false};$('ov').className='open';renderOv();
 const img=new Image();
 img.onload=()=>{try{
   const c=document.createElement('canvas');c.width=W;c.height=H+CAP;const g=c.getContext('2d');
   g.fillStyle='#120f1a';g.fillRect(0,0,W,H+CAP);g.drawImage(img,0,0,W,H);
   g.fillStyle='#dcae52';g.fillRect(0,H,W,3);
   g.textBaseline='middle';g.fillStyle='#e6b85a';g.font='600 40px "Noto Serif SC","Noto Serif","Songti SC",Georgia,serif';g.fillText(U.photoName.replace('2049',Y0+S.year),36,H+CAP/2+2);
   g.textAlign='right';g.fillStyle='#b3a78f';g.font='26px "Noto Serif SC","Noto Serif","Songti SC",Georgia,serif';
   g.fillText(U.photoCap(Math.min(S.week,WEEKS),S.mem.toLocaleString('en-US'),nOwn(S),ITEM.length),W-36,H+CAP/2+2);
   if(OV&&OV.kind=='photo'){OV.url=c.toDataURL('image/png');renderOv();}
  }catch(e){if(OV&&OV.kind=='photo'){OV.err=true;renderOv();}}};
 img.onerror=()=>{if(OV&&OV.kind=='photo'){OV.err=true;renderOv();}};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);

  ph:-1,st:'ev',sp:0,sl:60,cheat:false,peek:S?!!S.peek:false,cq:shufN(P.CLAIMS.length),ev:shufN(EV.length),mq:shufN(P.MEMOS.length),zw:shufN(P.ZW.length),zi:0,prev:null};

 $('purse').innerHTML=`<div>${U.purse[0]}<b>${fmt(S.ph>=1&&S.ph<=5?S.cash:S.tips)}</b></div><div>${U.purse[1]}<b>${fmt(S.fund)}</b></div><div>${U.purse[2]}<b>${fmt(S.wired)}</b></div>`;

function fix(){S.trust=clamp(S.trust);S.hq=clamp(Math.round(S.hq),0,HQMAX);S.risk=clamp(S.risk);S.cole=clamp(S.cole);S.mem=Math.max(10,Math.round(S.mem));}

function hit(){S.combo++;S.maxc=Math.max(S.maxc,S.combo);const tip=Math.round(S.mem*B.tip*Math.min(S.combo,B.comboCap)*S.tipM/10)*10;S.tips+=tip;return tip;}

function nextQ(){
 let ops,qi=-1;
 if(S.rd<2){if(S.ci&&S.ci%P.CLAIMS.length===0)S.cq=shufN(P.CLAIMS.length);qi=S.cq[S.ci++%P.CLAIMS.length];const x=rnd(P.DX.length);let y;do{y=rnd(P.DX.length)}while(y===x);
  ops=[['g',qi],['m',rnd(P.DM.length)],['x',x],Math.random()<.3?['e',rnd(P.EVA.length)]:['x',y],['a',rnd(P.ATK.length)]];}
 else ops=[['g',S.zw[S.zi++%P.ZW.length]],['e',rnd(P.ZF.length)],['a',rnd(P.ZH.length)]];
 S.q={qi,ops:ops.sort(()=>Math.random()-.5),zing:S.rd>=2};

function fbHtml(v){
 const pool={g:P.R_G,m:P.R_M,x:P.R_X,e:P.R_E,a:P.R_A}[v.k];

 return `<div class="fb ${v.k==='g'?'ok':v.k==='a'?'hot':'bad'}"><p><b>${U.ttl[v.k][v.last?1:0]}</b> ${t}</p>${v.tip?`<p class="money">${U.tipLine(v.combo,fmt(v.tip))}</p>`:''}<p class="res">${dl(v.d)}</p></div>`;

 if(!q.zing){
  show(`${pre}${tag(U.round(n))}<h2>${n==1?U.coleSays:U.coleAlso}</h2><div class="quote">${U.ql}${P.CLAIMS[q.qi][0]}${U.qr}<cite>${U.coleCite}</cite></div><p class="res hint">${U.hintVerse}</p>`);
  q.ops.forEach(([k,i],j)=>{const v=k=='g'||k=='m'||k=='x',src=k=='g'?P.CV[q.qi]:k=='m'?P.DM[i]:k=='x'?P.DX[i]:k=='e'?P.EVA[i]:P.ATK[i];
   const b=btn(`<span class="k">${LT[j]}</span>${v?`<span class="ref">${src[0]}</span>`:src[0]}`,v?U.ql+src[1]+U.qr:src[1],()=>answer(k));b.className='opt'+(v?' verse':'')+(S.peek&&k=='g'?' peek':'');});
 }else{

  q.ops.forEach(([k,i],j)=>{const t=k=='g'?P.ZW[i]:k=='e'?P.ZF[i]:P.ZH[i];btn(`<span class="k">${LT[j]}</span>${U.sl}${t}${U.sr}`,'',()=>answer(k)).className='opt'+(S.peek&&k=='g'?' peek':'');});
 }
}
function answer(k){
 const b=snap(),last=S.rd===2;let tip=0;
 if(!last&&!META.seen[S.q.qi]){META.seen[S.q.qi]=1;saveMeta();}
 if(k==='g'){S.cole-=last?3:5;S.trust+=last?1:3;if(!last)S.mem*=1.05;S.inspire+=.22;S.good++;S.wkG++;tip=hit();}
 else if(k==='m'){S.cole+=6;S.trust-=3;S.combo=0;}
 else if(k==='x'){S.cole+=3;S.trust-=1;S.combo=0;}
 else if(k==='e'){S.cole+=last?1:4;S.trust-=last?0:2;S.combo=0;}
 else{S.cole-=1;S.mem*=last?1.02:1.07;S.trust-=4;S.risk+=2;S.inspire+=.12;S.atk++;S.wkA++;tip=hit();}
 S.prev={k,last,qi:S.q.qi,ri:rnd(120),tip,combo:S.combo,d:diff(b)};
 S.rd++;
 if(S.rd<3)nextQ();else view(sermonEndV);
 if(tip)applaud(tip);
}

function offering(){S.ph=1;view(offerV);}
function offerV(){show(tag(U.steps[1])+`<h2>${U.offerH}</h2><p>${U.offerP(S.mem)}</p>${S.rz?`<p class="up">${U.rzLine(Math.round(S.rz*10)/10,B.rzMax,Math.round(S.rz*B.rzOffer*100))}</p>`:''}`);U.off.forEach((o,i)=>btn(o[0],o[1],()=>offerRes(i)));}
function offerRes(k){

 S.cash=off+S.tips;
 if(k===0){S.trust+=2;S.risk-=2;}else if(k===1){S.trust-=2;S.push+=0.5;}else{S.trust-=8;S.risk+=8;S.push+=1;}

function offerResV(){const o=S.o;show(tag(U.steps[1])+`<h2>${U.offerGot(`<span class="money">${fmt(S.cash)}</span>`)}</h2><p>${[P.O0,P.O1,P.O2][o.k][o.ri]}</p><p class="res">${U.offerSplit(fmt(o.off),fmt(S.tips))}${S.rz?' · '+U.rzLine(Math.round(S.rz*10)/10,B.rzMax,Math.round(S.rz*B.rzOffer*100)):''}<br>${dl(o.d)}</p>`);go(U.toOffice,wire);}

// 再汇多少，宠信就到上限：超过这个数，总部停止收款
function wireCap(){const need=HQMAX-S.hq;if(need<=0)return 0;return Math.ceil((-1+Math.sqrt(1+need/10))*20)*1000;}
function favGain(w){const k=w/1000;return Math.round(k*(1+k/40));}
function wire(){S.ph=2;S.sl=S.cash>0?Math.min(100,Math.ceil(quotaOf()/S.cash*20)*5):60;view(wireV);}
function wireV(){
 const quota=quotaOf(),cap=wireCap();
 show(tag(U.steps[2])+`<h2>${U.wireH}</h2><div class="memo">${U.memoHdr}<br>${P.MEMOS[S.mq[(S.year*WEEKS+S.week-1)%P.MEMOS.length]]}<br>${U.quota}<b class="money">${fmt(quota)}</b></div>
 <p>${U.wireP(`<span class="money">${fmt(S.cash)}</span>`)}</p>
 <input type="range" id="sl" min="0" max="100" step="5" value="${S.sl}" aria-label="${U.wireTo}">
 <div class="split"><span>${U.wireTo}<br><b class="money" id="vw"></b></span><span style="text-align:right">${U.wireKeep}<br><b id="vl"></b></span></div>
 <p class="res" id="hint"></p><p class="res">${U.favEst}<b class="money" id="fg"></b> · ${U.favNote}</p>`);
 const sl=$('sl'),up=()=>{S.sl=+sl.value;const want=S.cash*sl.value/100,w=Math.min(want,cap),stop=want>=cap;$('vw').textContent=fmt(w);$('vl').textContent=fmt(S.cash-w);
  if(stop){$('fg').textContent=cap?'+'+favGain(w)+U.capped:'+0';$('hint').innerHTML=`<span class="up">${cap?U.capSoon(HQMAX,fmt(cap)):U.capFull(HQMAX)}</span>`;return;}
  $('fg').textContent='+'+favGain(w)+(w<quota?U.halved:'');
  $('hint').innerHTML=w>=quota*1.5?`<span class="up">${U.qBig}</span>`:w>=quota?`<span class="up">${U.qOk}</span>`:`<span class="dn">${U.qMiss(fmt(quota-w))}</span>`;};
 sl.oninput=up;up();
 go(U.wireGo,()=>{const want=S.cash*sl.value/100,stop=want>=cap;wireRes(Math.min(want,cap),quota,+sl.value,stop);});
}
function wireRes(w,quota,pct,stop){
 const b=snap(),keep=S.cash-w,gain=favGain(w);let kind;
 S.wired+=w;S.fund+=keep;S.ww=w;
 if(stop){S.hq+=gain;kind=w?0:1;}
 else if(w>=quota*1.5){S.hq+=gain;kind=2;}
 else if(w>=quota){S.hq+=gain;kind=3;}
 else{S.hq+=Math.round(gain/2)-Math.max(3,Math.round((1-w/quota)*(B.missBase+S.hq*B.missHq)));kind=4;}
 const drained=pct>80&&!stop;if(drained){S.trust-=4;S.risk+=3;}
 S.risk-=1;
 S.w={w,keep,kind,drained,rate:(gain/Math.max(1,w/1000)).toFixed(1),d:diff(b)};view(wireResV);
}

function staff(){S.ph=3;S.sm=null;view(staffV);}
function staffV(){
 const m=S.sm,msg=m?(m.t=='fire'?U.fired(P.STAFF[m.i][0],P.BYE[m.r%P.BYE.length]):U.hired(P.STAFF[m.i][0],P.STAFF[m.i][3+m.r%2])):'';
 show(tag(U.staffTag)+`<h2>${U.staffH(`<span class="money">${S.hq}</span>`,HQMAX,`<span class="dn">${upkeep()}</span>`)}</h2><p class="res${msg?'':' hint'}">${msg||U.staffP}</p>`);
 const tabs=document.createElement('div');tabs.className='tabs';$('card').appendChild(tabs);
 TRKK.forEach((t,ti)=>{const n=STF.filter(p=>p.t==t&&S.crew[p.k]).length,b=btn(U.trk[ti]+(n?U.inPost(n):''),'',()=>{S.st=t;S.sm=null;view(staffV);},tabs);if(t==S.st)b.className='on';});
 const ti=TRKK.indexOf(S.st);
 STF.forEach((p,i)=>{if(p.t!=S.st)return;
  const on=!!S.crew[p.k],c=COST[p.lv],T=P.STAFF[i],d=document.createElement('div');d.className='stf'+(on?' on':'');

  if(!on&&S.hq<=c)b.disabled=true;
 });

function staffWeek(){
 const on=STF.map((p,i)=>[p,i]).filter(([p])=>S.crew[p.k]).sort((a,b)=>COST[a[0].lv]-COST[b[0].lv]);
 const r={quit:[],kept:[],sum:{ev:0,mi:0,la:0,re:0},paid:0,sp:-1,q:rnd(2),rn:S.mem};
 on.forEach(([p,i])=>{const c=COST[p.lv];
  if(S.hq-c<1){delete S.crew[p.k];r.quit.push([i,rnd(12)]);return;}
  S.hq-=c;r.paid+=c;r.sum[p.t]+=stfApply(p);r.kept.push(i);});
// 慰问金定期到账；每位抗争同工每周出手捉拿一次“犹大的差役”（放贷公司的催收员），成功一次就多一大笔安抚费
 if(r.sum.re){const base=rallyGain();r.cf=Math.round(r.sum.re*B.comfort/100)*100;r.tr=0;r.hit=0;r.pf=0;
  r.kept.forEach(i=>{const q=STF[i];if(q.t!='re')return;r.tr++;if(Math.random()<B.catchP[q.lv]){r.hit++;r.pf+=Math.round(base*TRKV.re[q.lv]*B.pacify/100)*100;}});
  r.sum.re=r.cf+r.pf;S.fund+=r.sum.re;S.caught=(S.caught||0)+r.hit;}
 const re=r.kept.filter(i=>STF[i].t=='re'),g=re.reduce((a,i)=>a+B.rzGain[STF[i].lv],0);
 S.rz=Math.round((g?Math.min(B.rzMax,(S.rz||0)+g):Math.max(0,(S.rz||0)-2))*100)/100;r.rz=S.rz;r.ld=re.length?re[re.length-1]:-1;
 if(r.kept.length)r.sp=r.kept[rnd(r.kept.length)];
 return r;
}

 if(r.sum.re)h+=`<p>${U.rally(P.STAFF[r.ld>=0?r.ld:18][0],(r.rn||0).toLocaleString('en-US'),`<span class="money">${fmt(r.cf)}</span>`)} ${r.hit?U.rallyP(r.hit,r.tr,`<span class="money">${fmt(r.pf)}</span>`):U.rallyNo(r.tr||0)} ${U.rzUp(Math.round((r.rz||0)*10)/10,B.rzMax)}</p>`;

const PG=[[0,11],[11,21],[21,31]];

 const m=S.shm,msg=m?(m.t=='buy'?U.bought(P.ITEMS[m.i][0]):U.pantryDone)+' '+dl(m.d):'';
 show(tag(U.shopTag(nOwn(S),ITEM.length))+`<h2>${U.purse[1]} <span class="money">${fmt(S.fund)}</span></h2><p class="res${msg?'':' hint'}">${msg||U.shopP}</p>`);
 const d=btn(`${U.pantry} · ${B.pantryMax-S.pn}/${B.pantryMax}`,U.pantrySub,()=>{const s=snap();S.pn++;S.fund-=3000;S.local+=3000;S.trust+=2;S.mem+=3;S.shm={t:'pantry',d:diff(s)};view(shopV);});
 d.disabled=S.fund<3000||S.pn>=B.pantryMax;
 const tabs=document.createElement('div');tabs.className='tabs';$('card').appendChild(tabs);
 PG.forEach((g,i)=>{const own=ITEM.slice(g[0],g[1]).filter(x=>S.own[x.k]).length,b=btn(`${U.pg[i]} ${own}/${g[1]-g[0]}`,'',()=>{S.sp=i;S.shm=null;view(shopV);},tabs);if(i==S.sp)b.className='on';});
 const box=document.createElement('div');box.className='shop';box.id='shop';$('card').appendChild(box);
 for(let i=PG[S.sp][0];i<PG[S.sp][1];i++){const it=ITEM[i],T=P.ITEMS[i],own=!!S.own[it.k];
  const b=btn(`<span class="row"><span>${T[0]}</span><span class="pr">${own?U.placed:fmt(it.p)}</span></span>`,descE(it.e)+(T[1]?U.pl+T[1]+U.pr_:''),()=>{const s=snap();S.fund-=it.p;S.spent+=it.p;S.own[it.k]=1;applyE(it.e);S.shm={t:'buy',i,d:diff(s)};view(shopV);},box);
  b.disabled=own||S.fund<it.p;if(own)b.className='own';}
 go(U.toWeek,event);
}

function event(){
 if(check())return;
 S.ph=5;
 S.t=S.year*WEEKS+S.week;
 const b=snap(),ei=S.ev[(S.t-1)%EV.length],br=EV[ei](S);
 const dn=S.cole<S.c0,ok=CHATC.map((c,i)=>c(S)?i:-1).filter(i=>i>=0),ch=ok.length>1?ok[rnd(ok.length-1)]:ok[0];
 S.cole+=Math.round(B.coleBase+S.week*B.coleWeek+S.year*B.coleYear);S.trust-=Math.round(B.trustBase+S.mem/B.trustDrift);S.risk+=Math.round(B.riskBase+S.ww/B.riskWire);const sr=staffWeek();
 fix();const cap=capOf(),lost=Math.max(0,S.mem-cap);if(lost)S.mem=cap;
 S.e={ei,br,dn,ci:rnd(6),ch,sr,lost,d:diff(b)};view(eventV);
}
function eventV(){
 const e=S.e,T=P.EVENTS[e.ei],C=P.CHAT[e.ch];
 show(tag(U.steps[5])+`<h2>${U.eventH}</h2><div class="chat"><b>${C[0]}</b>${U.colon}${C[1]}</div><p>${T[0]} ${T[1+e.br]||T[1]}</p>
 <div class="quote">${(e.dn?P.COLE_DN:P.COLE_UP)[e.ci]}<cite>${U.coleRegroup}</cite></div>${staffWeekHtml(e.sr)}${e.lost?`<p class="dn">${U.overflow(e.lost)}</p>`:''}<p class="res">${U.drift}</p><p class="res">${dl(e.d)}</p>`);
 go(S.week>=WEEKS?U.yearEnd:U.nextSunday,()=>{if(check())return;if(S.week<WEEKS&&S.week%B.draftEvery===0){draft();return;}advance();});
}
// 海军征兵：每两个月一次。会众交钱免役，名额是会众的一半；之后人数减半
function draft(){
 fix();const n=S.mem,taken=Math.floor(n/2),gift=Math.round(n*B.draftHead*(0.5+S.trust/100)/100)*100;
 S.ph=5;S.cash=gift;S.sl=50;S.dr={n,taken,gift};view(draftV);
}
function draftV(){
 const x=S.dr,cap=wireCap();
 show(tag(U.draftTag)+`<h2>${U.draftH}</h2><p>${U.draftP(x.n,x.taken,`<span class="money">${fmt(x.gift)}</span>`)}</p>
 <input type="range" id="sl" min="0" max="100" step="5" value="${S.sl}" aria-label="${U.wireTo}">
 <div class="split"><span>${U.wireTo}<br><b class="money" id="vw"></b></span><span style="text-align:right">${U.wireKeep}<br><b id="vl"></b></span></div>
 <p class="res" id="hint"></p><p class="res">${U.favEst}<b class="money" id="fg"></b></p>`);
 const sl=$('sl'),up=()=>{S.sl=+sl.value;const want=x.gift*sl.value/100,w=Math.min(want,cap),stop=want>=cap&&want>0;$('vw').textContent=fmt(w);$('vl').textContent=fmt(x.gift-w);
  $('fg').textContent='+'+favGain(w)+(stop&&cap?U.capped:'');$('hint').innerHTML=stop?`<span class="up">${cap?U.capSoon(HQMAX,fmt(cap)):U.capFull(HQMAX)}</span>`:'';};
 sl.oninput=up;up();
 go(U.draftGo,()=>draftRes(Math.min(x.gift*sl.value/100,cap)));
}
function draftRes(w){
 const b=snap(),x=S.dr;x.w=w;x.keep=x.gift-w;
 S.wired+=w;S.fund+=x.keep;S.hq+=favGain(w);S.mem-=x.taken;S.drafted=(S.drafted||0)+x.taken;S.trust-=4;S.risk+=Math.round(2+x.gift/100000);
 x.d=diff(b);view(draftResV);
}
function draftResV(){
 const x=S.dr;show(tag(U.draftTag)+`<h2>${U.wired(fmt(x.w),fmt(x.keep))}</h2><p>${U.draftR(x.taken)}</p><p class="res">${dl(x.d)}</p>`);
 go(U.nextSunday,()=>{if(check())return;advance();});
}
// 往下走一个主日；一年十个主日，任期四年
function advance(){
 if(S.week<WEEKS){S.week++;sermon();return;}
 if(S.year>=YEARS-1){ending();return;}
 S.ph=-1;S.ye={k:finKind(),y:S.year};view(yearEndV);
}
function yearEndV(){
 const e=S.ye,rows=[[U.tally[0],S.mem.toLocaleString('en-US')],[U.tally[2],`<span class="money">${fmt(S.wired)}</span>`],[U.tally[3],S.hq],[U.tally[5],fmt(S.local)],[U.tally[6],`${nOwn(S)} / ${ITEM.length}`],[U.verdict,U.fin[e.k][0]]];
 show(tag(U.yearTag(Y0+e.y,e.y+1,YEARS))+`<h2 class="big">${U.yearH(Y0+e.y)}</h2><p>${U.yearP}</p><table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`);
 go(U.nextYear(Y0+e.y+1),()=>{S.year++;S.week=1;sermon();});
}
function finKind(){
 const n=nOwn(S),T=YEARS;
 if(S.wired>=1000000*T&&S.local<15000*T)return 0;
 if(S.trust>=75&&S.cole<=25&&S.local>=30000*T)return 1;
 if(n>=24&&S.local<27000*T)return 2;
 if(S.cole<=25)return 3;
 return 4;
}
function check(){
 fix();
 const k=S.trust<=0?0:S.hq<=0?1:S.risk>=100?2:S.cole>=100?3:-1;
 if(k<0)return false;
 S.ph=-1;S.end={over:k};META.ends['o'+k]=1;saveMeta();view(endV);return true;
}
function ending(){
 S.ph=-1;const k=finKind();
 S.end={fin:k};META.ends['f'+k]=1;saveMeta();view(endV);
}
function endV(){
 const e=S.end,o=e.over!==undefined,T=o?U.over[e.over]:U.fin[e.fin];
 const rows=[S.mem.toLocaleString('en-US'),'×'+S.maxc,`<span class="money">${fmt(S.wired)}</span>`,S.hq,`${Object.keys(S.crew).length} / ${STF.length}`,fmt(S.local),`${nOwn(S)} / ${ITEM.length} (${fmt(S.spent)})`,`${S.good} / ${S.atk}`,(S.drafted||0).toLocaleString('en-US'),S.caught||0];
 show(tag(o?U.overTag(Math.min(S.week,WEEKS),Y0+S.year):U.finTag)+`<h2 class="big">${T[0]}</h2><p>${T[1]}</p><table>${rows.map((v,i)=>`<tr><td>${i<U.tally.length?U.tally[i]:i==U.tally.length?U.tallyDraft:U.tallyCaught}</td><td>${v}</td></tr>`).join('')}</table>${S.cheat?`<p class="res">${U.cheated}</p>`:''}`);
 btn(U.photoKeep,'',takePhoto).style.textAlign='center';
 go(o?U.restart:U.again,start);
}
initLang();if(!resume())start();
</script>
